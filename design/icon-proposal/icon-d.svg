<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- D 蜂巢：三格蜂房并排 = 并行工位；中间琥珀格 = 活跃 agent（蜂巢→蜂蜜色） -->
  <rect x="32" y="32" width="960" height="960" rx="216" fill="#1A1712"/>
  <rect x="33" y="33" width="958" height="958" rx="215" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2"/>
  <!-- 点尖六边形 R=150：中心 (190,512) / (512,512) / (834,512) -->
  <polygon points="190,362 320,437 320,587 190,662 60,587 60,437"
           fill="#1A1712" stroke="#E4E4E4" stroke-width="40" stroke-linejoin="round"/>
  <polygon points="834,362 964,437 964,587 834,662 704,587 704,437"
           fill="#1A1712" stroke="#E4E4E4" stroke-width="40" stroke-linejoin="round"/>
  <polygon points="512,362 642,437 642,587 512,662 382,587 382,437" fill="#F0A32C"/>
</svg>
