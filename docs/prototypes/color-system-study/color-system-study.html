#color-system-study .cs-tooltip-example { background: var(--cs-overlay); color: var(--cs-secondary); padding: 6px 10px; border-radius: 6px; font-size: 12px; border: 1px solid var(--cs-line); }
#color-system-study .cs-progress { height: 5px; background: var(--cs-hover); border-radius: 99px; overflow: hidden; margin: 15px 0 7px; }
#color-system-study .cs-progress span { display: block; width: 65%; height: 100%; background: var(--cs-info); }
#color-system-study .cs-mini-board { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 7px; }
#color-system-study .cs-mini-board > div { background: var(--cs-chrome); padding: 8px; border-radius: 7px; }
#color-system-study .cs-task-card { background: var(--cs-raised); border-radius: 6px; padding: 11px 9px; margin-top: 8px; }
#color-system-study .cs-task-card small { display: block; margin: 8px 0; }
#color-system-study .cs-memory-row { display: flex; align-items: center; gap: 9px; padding: 12px 0; }
#color-system-study .cs-memory-row > span:first-of-type { flex: 1; min-width: 0; }
#color-system-study .cs-statistics { display: flex; align-items: end; gap: 25px; }
#color-system-study .cs-statistics b { font-size: 24px; }
#color-system-study .cs-statistics > div:first-child > span { display: block; font-size: 12px; color: var(--cs-secondary); }
#color-system-study .cs-bars { display: flex; align-items: end; gap: 8px; height: 75px; flex: 1; }
#color-system-study .cs-bars span { background: var(--cs-info); width: 100%; max-width: 28px; border-radius: 3px 3px 0 0; }
#color-system-study .cs-mobile-sample { max-width: 290px; margin: 15px auto 0; background: var(--cs-chrome); padding: 12px; border-radius: 10px; }
#color-system-study .cs-mobile-sample > div:first-child { display: flex; align-items: center; gap: 8px; font-size: 12px; }
#color-system-study .cs-mobile-sample .cs-user-bubble { margin: 20px 0 18px auto; font-size: 12px; }
#color-system-study .cs-modal-scrim { position: absolute; inset: 40px 0 0; z-index: 50; display: grid; place-items: center; background: color-mix(in srgb,var(--cs-canvas) 72%,transparent); }
#color-system-study .cs-dialog { width: min(390px,calc(100% - 28px)); background: var(--cs-overlay); border: 1px solid var(--cs-line); box-shadow: 0 16px 48px color-mix(in srgb,var(--cs-text) 18%,transparent); border-radius: 12px; padding: 24px; }
#color-system-study .cs-dialog h3 { margin: 0; }
#color-system-study .cs-dialog p { margin: 16px 0 24px; color: var(--cs-secondary); }
#color-system-study .cs-dialog .cs-sample-row { justify-content: end; }
#color-system-study .cs-rules { background: var(--cs-canvas); border-radius: 9px; margin: 0 7px 7px; padding: 30px; }
#color-system-study .cs-palette-grid { display: grid; grid-template-columns: repeat(7,minmax(0,1fr)); gap: 6px; margin: 22px 0; }
#color-system-study .cs-palette-grid > div { padding: 15px 10px; border-radius: 7px; display: flex; flex-direction: column; gap: 8px; }
#color-system-study .cs-palette-grid span { color: var(--cs-secondary); font-size: 12px; }
#color-system-study .cs-palette-grid code { font-size: 12px; }
#color-system-study .cs-rules table { border-collapse: collapse; width: 100%; font-size: 13px; }
#color-system-study .cs-rules :is(th,td) { padding: 12px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--cs-line); }
#color-system-study .cs-rules th { color: var(--cs-secondary); font-weight: 400; }
#color-system-study .cs-rules td:first-child { width: 80px; }
#color-system-study .cs-rules td:nth-child(2) { width: 250px; }
#color-system-study .cs-rules td:last-child { color: var(--cs-secondary); }
#color-system-study .cs-coverage { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 13px; }
#color-system-study .cs-coverage > div { display: flex; align-items: center; gap: 7px; color: var(--cs-secondary); }
#color-system-study .mp-pop { transition: transform var(--dur-menu) var(--ease-standard),opacity var(--dur-menu) var(--ease-standard); transform-origin: top right; }
#color-system-study .mp-panel { transition: transform var(--dur-panel) var(--ease-standard),opacity var(--dur-panel) var(--ease-standard); }
#color-system-study .mp-scrim { transition: opacity var(--dur-panel) var(--ease-standard); }
#color-system-study [data-mp-stage='enter'].mp-pop { opacity: 0; transform: scale(.98); transition: none; }
#color-system-study [data-mp-stage='out'].mp-pop { opacity: 0; transform: scale(.98); transition-duration: var(--dur-micro); }
#color-system-study [data-mp-stage='enter'].mp-panel { opacity: 0; transform: translateY(8px) scale(.985); transition: none; }
#color-system-study [data-mp-stage='out'].mp-panel { opacity: 0; transform: translateY(8px) scale(.985); transition-duration: var(--dur-exit); }
#color-system-study [data-mp-stage='enter'].mp-scrim, #color-system-study [data-mp-stage='out'].mp-scrim { opacity: 0; }
#color-system-study [data-mp-stage='out'] { pointer-events: none; }
@media (max-width: 1100px) { #color-system-study .cs-workbench { grid-template-columns: 150px minmax(260px,.8fr) 6px minmax(380px,1.15fr); } #color-system-study .cs-globalbar > .cs-icon:nth-of-type(2), #color-system-study .cs-globalbar > .cs-icon:nth-of-type(3) { display: none; } #color-system-study .cs-compose-tools > .cs-meta { display: none; } #color-system-study .cs-workbench.with-terminal { grid-template-columns: 135px minmax(430px,1.4fr) 6px minmax(320px,1fr); } #color-system-study .with-terminal .cs-right-body { grid-template-columns: minmax(0,1fr); } #color-system-study .with-terminal .cs-right-body > :is(.cs-resources,.cs-divider) { display: none; } }
@media (max-width: 900px) { #color-system-study .cs-workbench { grid-template-columns: 140px minmax(0,1fr); padding-right: 6px; } #color-system-study .cs-center { min-height: 520px; } #color-system-study .cs-workbench > .cs-divider { display: none; } #color-system-study .cs-right { grid-column: 2; min-height: 540px; margin-top: 6px; } #color-system-study .cs-sidebar { grid-row: span 2; } #color-system-study .cs-workbench.with-terminal { grid-template-columns: 140px minmax(0,1fr); } #color-system-study .cs-settings-nav { flex-basis: 165px; } #color-system-study .cs-settings-inner { padding: 25px; } #color-system-study .cs-setting-row { flex-wrap: wrap; gap: 14px; } #color-system-study .cs-palette-grid { grid-template-columns: repeat(4,minmax(0,1fr)); } #color-system-study .cs-coverage { grid-template-columns: repeat(2,minmax(0,1fr)); } }
@media (max-width: 600px) { #color-system-study .cs-workbench, #color-system-study .cs-workbench.with-terminal { display: block; padding: 0 6px 6px; } #color-system-study .cs-sidebar { display: none; } #color-system-study .cs-right { margin-top: 6px; min-height: 500px; } #color-system-study .cs-center { min-height: 550px; } #color-system-study .with-terminal .cs-center { flex-direction: column; } #color-system-study .with-terminal .cs-center .cs-divider { display: none; } #color-system-study .cs-right-body { grid-template-columns: minmax(0,1fr); } #color-system-study .cs-right-body > :is(.cs-resources,.cs-divider) { display: none; } #color-system-study .cs-app-chrome { flex-wrap: wrap; padding-top: 6px; padding-bottom: 6px; } #color-system-study .cs-settings { display: block; } #color-system-study .cs-settings-nav { display: flex; flex-wrap: wrap; gap: 4px; padding: 5px 0 14px; } #color-system-study .cs-settings-nav h2, #color-system-study .cs-settings-nav .cs-search { display: none; } #color-system-study .cs-settings-nav .cs-list-row { width: auto; font-size: 12px; } #color-system-study .cs-settings-inner { padding: 23px 18px; } #color-system-study .cs-gallery { grid-template-columns: minmax(0,1fr); padding: 22px 16px; } #color-system-study .cs-palette-grid { grid-template-columns: repeat(2,minmax(0,1fr)); } #color-system-study .cs-rules { padding: 22px 14px; overflow-x: auto; } #color-system-study .cs-rules td:nth-child(2) { width: auto; } #color-system-study .cs-coverage { grid-template-columns: minmax(0,1fr); } #color-system-study .cs-view-tabs { gap: 0; flex-wrap: wrap; } #color-system-study .cs-study-controls { gap: 8px; } #color-system-study .cs-study-title { width: 100%; } #color-system-study .cs-tab span { max-width: 100px; } }
@media (prefers-reduced-motion: reduce) { #color-system-study :is(.mp-pop,.mp-panel,.mp-scrim) { transition-duration: var(--dur-reduced); } }
