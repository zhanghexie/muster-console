<div id="envelope-send-preview" class="viz-dotted-background"><div id="envelope-send-mount"></div></div>
<style>#envelope-send-study {--ease-standard:cubic-bezier(0.16, 1, 0.3, 1);--ease-exit:cubic-bezier(0.4, 0, 0.2, 1);--ease-hover:ease-out;--ease-move:cubic-bezier(0.33, 0.1, 0.25, 1);--ease-loop:cubic-bezier(0.37, 0, 0.63, 1);--dur-micro:120ms;--dur-menu:160ms;--dur-panel:280ms;--dur-exit:200ms;--dur-move:420ms;--dur-stagger:30ms;--dur-loop:900ms;--dur-breath:1800ms;}
#envelope-send-study {
  color-scheme: light dark;
  --es-bg: light-dark(#f0f0ee, #252523);
  --es-ink: light-dark(#292824, #eeece7);
  --es-muted: light-dark(#706e66, #aaa79e);
  --es-line: light-dark(#dedbd4, #44433e);
  --es-button: light-dark(#302f2a, #e9e6de);
  --es-button-text: light-dark(#fffdf7, #272622);
  --es-paper: #fff;
  --es-paper-back: #fafafa;
  --es-envelope: #fff;
  --es-envelope-edge: #e4e4e4;
  --es-envelope-radius: 3px;
  --es-width: 300px;
  --es-third: 130px;
  --es-mouth: var(--es-third);
  --es-pocket-h: calc(var(--es-third) * 1.15);
  --es-lid-h: calc(var(--es-third) * .76);
  --es-flight-distance: -660px;
  color: var(--es-ink); background: var(--es-bg);
  font: 14px/1.6 'Segoe UI', 'Microsoft YaHei', sans-serif;
  border-radius: 16px; overflow: hidden; position: relative;
  isolation: isolate;
}
#envelope-send-study[data-theme='dark'] { color-scheme: dark; }
#envelope-send-study[data-theme='light'] { color-scheme: light; }
#envelope-send-study * { box-sizing: border-box; }
#envelope-send-study button { font: inherit; color: inherit; border: 0; background: transparent; cursor: pointer; padding: 8px 12px; border-radius: 8px; }
#envelope-send-study button:disabled { opacity: .4; cursor: default; }
#envelope-send-study button:focus-visible, #envelope-send-study input:focus-visible { outline: 2px solid var(--es-muted); outline-offset: 3px; }
#envelope-send-study .es-toolbar { display: flex; justify-content: space-between; align-items: center; padding: 14px 22px; border-bottom: 1px solid var(--es-line); }
#envelope-send-study .es-wordmark { font-weight: 500; letter-spacing: 2px; }
#envelope-send-study .es-wordmark > span { font-size: 10px; letter-spacing: 1px; color: var(--es-muted); }
#envelope-send-study .es-scene { height: 488px; position: relative; overflow: hidden; }
#envelope-send-study .es-presence { position: absolute; inset: 0; transition: opacity var(--dur-micro) var(--ease-exit); }
#envelope-send-study .es-presence[data-mp-stage='out'] { opacity: 0; pointer-events: none; }
#envelope-send-study .es-flight { position: absolute; inset: 0; transform: translateY(0); transition: transform var(--es-flight-duration) var(--ease-loop) var(--es-flight-delay); }
#envelope-send-study .es-package { position: absolute; width: var(--es-width); height: var(--es-third); left: calc(50% - var(--es-width) / 2); top: calc(50% - var(--es-third) / 2); transform: scale(.87); transform-origin: 50% 50%; }
#envelope-send-study .es-envelope-rear, #envelope-send-study .es-envelope-pocket, #envelope-send-study .es-envelope-front-lid { position: absolute; left: 0; right: 0; top: var(--es-mouth); height: var(--es-pocket-h); }
#envelope-send-study .es-envelope-rear { z-index: 0; perspective: 1500px; }
#envelope-send-study .es-shape-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
#envelope-send-study .es-envelope-body { position: absolute; inset: 0; background: #f0f0f0; border-radius: var(--es-envelope-radius); box-shadow: 0 .6px 0 #cfcfcf, 0 10px 18px #00000014, 0 1px 2px #0000000a; }
#envelope-send-study .es-lid-pivot { position: absolute; inset: 0 0 auto; height: var(--es-lid-h); transform-origin: 50% 0; transform: rotateX(180deg); transform-style: preserve-3d; transition: transform var(--es-lid-duration) var(--ease-move) var(--es-lid-delay); }
#envelope-send-study .es-lid-inside, #envelope-send-study .es-lid-outside { position: absolute; inset: 0; backface-visibility: hidden; }
#envelope-send-study .es-lid-inside { transform: rotateY(180deg); }
#envelope-send-study .es-lid-inside::before, #envelope-send-study .es-lid-inside::after,
#envelope-send-study .es-lid-outside::before, #envelope-send-study .es-lid-outside::after { content: ''; position: absolute; inset: 0; clip-path: var(--es-lid-clip); }
#envelope-send-study .es-lid-inside::before, #envelope-send-study .es-lid-outside::before { background: #dcdcdc; transform: translateY(.4px); }
#envelope-send-study .es-lid-inside::after { background: #fafafa; }
#envelope-send-study .es-lid-outside::after { background: #fff; }
#envelope-send-study .es-envelope-front-lid { z-index: 4; perspective: 1500px; pointer-events: none; }
#envelope-send-study .es-sheet-depth { position: absolute; inset: 0; z-index: 3; perspective: 1500px; }
#envelope-send-study[data-paper-layer='inside'] .es-sheet-depth { z-index: 1; }
#envelope-send-study .es-insert { width: 100%; height: 100%; transform: translateY(0); transition: transform var(--es-insert-duration) var(--ease-loop) var(--es-insert-delay); }
#envelope-send-study .es-sheet-scale { width: 100%; height: 100%; perspective: 1500px; transform: scale(calc(1 / .87)); transition: transform var(--es-top-duration) var(--ease-move); }
#envelope-send-study .es-paper { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; }
#envelope-send-study .es-panel { position: absolute; width: 100%; height: 100%; transform-style: preserve-3d; }
#envelope-send-study .es-face { position: absolute; inset: 0; backface-visibility: hidden; background: var(--es-paper); overflow: hidden; }
#envelope-send-study .es-middle { inset: 0; }
#envelope-send-study .es-top { top: -100%; transform-origin: 50% 100%; transform: rotateX(0deg); transition: transform var(--es-top-duration) var(--ease-loop) var(--es-top-delay); }
#envelope-send-study .es-bottom { top: 100%; transform-origin: 50% 0; transform: rotateX(0deg); transition: transform var(--es-bottom-duration) var(--ease-loop) var(--es-bottom-delay); }
#envelope-send-study .es-back { transform: rotateX(180deg); background: linear-gradient(0deg, var(--es-paper-back), var(--es-paper)); }
#envelope-send-study .es-top .es-front { border-radius: 3px 3px 0 0; }
#envelope-send-study .es-bottom .es-front { border-radius: 0 0 3px 3px; }
#envelope-send-study .es-letter-slice { position: absolute; inset: 0; height: 300%; }
#envelope-send-study .es-letter-content { height: 100%; padding: 25px 28px; color: #39372f; background: var(--es-paper); }
#envelope-send-study .es-letter-meta { display: flex; justify-content: space-between; align-items: center; font-size: 9px; letter-spacing: 1.5px; color: #817c70; }
#envelope-send-study h2 { font: 500 28px/1.3 'SimSun', 'Songti SC', serif; letter-spacing: 3px; margin: 35px 0 24px; }
#envelope-send-study .es-letter-content p { font-size: 12px; line-height: 2; margin: 0 0 14px; }
#envelope-send-study .es-signature { text-align: right; font-size: 12px; line-height: 1.9; margin-top: 21px; }
#envelope-send-study .es-signature span { font-size: 10px; color: #817c70; }
#envelope-send-study .es-letter-footer { font-size: 8px; letter-spacing: 1.4px; color: #817c70; margin-top: 23px; }
#envelope-send-study .es-envelope-pocket { z-index: 2; border-radius: var(--es-envelope-radius); overflow: hidden; }
#envelope-send-study .es-pocket-surface { position: absolute; inset: 0; border-radius: inherit; background: var(--es-envelope); border: 1px solid #e3e3e388; box-shadow: inset 0 -.5px 0 #e7e7e7; }
#envelope-send-study[data-playing='true'] .es-sheet-scale { transform: scale(.94); }
#envelope-send-study[data-playing='true'] .es-top { transform: rotateX(-179.8deg); }
#envelope-send-study[data-playing='true'] .es-bottom { transform: translateZ(1px) rotateX(179.8deg); }
#envelope-send-study[data-playing='true'] .es-insert { transform: translateY(calc(var(--es-third) * 1.08)); }
#envelope-send-study[data-playing='true'] .es-lid-pivot { transform: rotateX(0deg); }
#envelope-send-study[data-playing='true'] .es-flight { transform: translateY(var(--es-flight-distance)); }
#envelope-send-study:not([data-playing='true']) .es-flight,
#envelope-send-study:not([data-playing='true']) .es-package,
#envelope-send-study:not([data-playing='true']) .es-insert,
#envelope-send-study:not([data-playing='true']) .es-sheet-scale,
#envelope-send-study:not([data-playing='true']) .es-panel,
#envelope-send-study:not([data-playing='true']) .es-pocket-surface,
#envelope-send-study:not([data-playing='true']) .es-lid-pivot { transition: none; }
#envelope-send-study .es-controls { border-top: 1px solid var(--es-line); padding: 15px 22px; }
#envelope-send-study .es-status { margin-right: auto; color: var(--es-muted); font-size: 12px; }
#envelope-send-study .es-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
#envelope-send-study .es-actions label { display: flex; align-items: center; gap: 4px; color: var(--es-muted); font-size: 12px; margin-right: 4px; cursor: pointer; }
#envelope-send-study input { accent-color: var(--es-muted); }
#envelope-send-study .es-send { background: var(--es-button); color: var(--es-button-text); padding: 9px 16px; }
#envelope-send-study .es-send span { margin-left: 15px; }
#envelope-send-study .es-scrub { display: flex; gap: 12px; align-items: center; font-size: 11px; color: var(--es-muted); margin-top: 10px; }
#envelope-send-study .es-scrub input { flex: 1; width: 0; }
#envelope-send-study .es-scrub output { min-width: 32px; text-align: right; font-variant-numeric: tabular-nums; }
@media (max-width: 420px) {
  #envelope-send-study { --es-width: 264px; --es-third: 128px; }
  #envelope-send-study .es-toolbar, #envelope-send-study .es-controls { padding-left: 14px; padding-right: 14px; }
  #envelope-send-study .es-wordmark > span { display: none; }
  #envelope-send-study .es-scene { height: 468px; }
  #envelope-send-study .es-letter-content { padding-left: 23px; padding-right: 23px; }
  #envelope-send-study .es-status { flex-basis: 100%; text-align: center; }
  #envelope-send-study .es-actions { justify-content: center; }
}
@media (prefers-reduced-motion: reduce) {
  #envelope-send-study * { transition: none !important; }
}
html[data-ui-motion='reduced'] #envelope-send-study * { transition: none !important; }
