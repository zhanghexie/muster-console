<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>扩展 Agent 共享操作示例</title>
<style>
:root{--bg:#f3f5f8;--panel:#fff;--panel2:#f8f9fc;--ink:#202536;--muted:#737b91;--line:#e1e5ee;--accent:#565bd6;--soft:#eef0ff;--green:#26734d;--greenbg:#e9f8ee;--orange:#9b5a16;--orangebg:#fff4df;--red:#9b3d45;--redbg:#fff0f1;--dur-micro:120ms;--dur-panel:280ms;--ease:cubic-bezier(.16,1,.3,1);--mono:ui-monospace,Consolas,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:8px 11px;cursor:pointer;transition:transform var(--dur-micro) var(--ease),border-color var(--dur-micro) ease,background var(--dur-micro) ease,color var(--dur-micro) ease}button:hover{border-color:var(--accent);color:var(--accent)}button:active{transform:scale(.97)}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button.ghost{background:transparent}button.icon{padding:5px 8px;font-size:16px}input,select{border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);padding:9px 10px;outline:0}input:focus,select:focus{border-color:var(--accent)}
.shell{max-width:1480px;min-height:100vh;margin:auto;padding:20px}.head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:15px}.eyebrow{color:var(--accent);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.head h1{font-size:30px;line-height:1.1;margin:3px 0 5px}.head p{margin:0;max-width:850px;color:var(--muted)}.head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:end}.legend{display:flex;gap:7px;flex-wrap:wrap;justify-content:end;color:var(--muted);font-size:12px}.legend span{padding:5px 8px;border:1px solid var(--line);background:var(--panel);border-radius:99px}.tabs{display:flex;gap:7px;overflow:auto;padding:5px 0 13px}.tabs button{white-space:nowrap}.tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 382px;gap:15px;align-items:stretch;transition:grid-template-columns var(--dur-panel) var(--ease)}.layout.closed{grid-template-columns:minmax(0,1fr) 0fr}.surface,.agent{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 34px rgba(43,50,83,.06)}.surface{min-height:710px;padding:18px;overflow:hidden}.surface-head{display:flex;justify-content:space-between;align-items:start;gap:12px;border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:15px}.surface-title{font-size:21px;font-weight:800}.surface-description{margin-top:3px;max-width:760px;color:var(--muted)}.surface-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:end}.metric-row{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 17px}.metric{min-width:118px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--panel2)}.metric b{display:block;font-size:19px}.metric small{color:var(--muted)}.label{margin:17px 0 8px;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.04em}.notice{margin-top:15px;padding:11px 13px;border-radius:10px;background:var(--greenbg);color:var(--green);font-size:13px}.notice code{font:11px var(--mono);margin-right:5px}.small{font-size:12px;color:var(--muted)}.activity{display:flex;gap:8px;align-items:center;margin-top:13px;padding:8px 0;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.activity strong{color:var(--ink)}.tag{display:inline-flex;padding:3px 7px;border-radius:99px;font-size:11px;font-weight:700;background:var(--soft);color:#4448a7}.tag.green{background:var(--greenbg);color:var(--green)}.tag.orange{background:var(--orangebg);color:var(--orange)}
.task-list,.book-list{display:flex;flex-direction:column;gap:8px}.task-row{display:flex;align-items:center;gap:9px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--panel2)}.task-row.selected{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--soft)}.task-row.done .task-title{text-decoration:line-through;color:var(--muted)}.task-check{width:24px;height:24px;padding:0;border-radius:7px;display:grid;place-items:center}.task-check.checked{background:var(--green);border-color:var(--green);color:#fff}.task-main{min-width:0;flex:1;cursor:pointer}.task-title,.book-title{font-weight:700}.task-meta,.book-author{font-size:12px;color:var(--muted)}.add-row{display:flex;gap:8px;margin-top:10px}.add-row input{flex:1}
.book-row{display:grid;grid-template-columns:minmax(0,1fr) 100px 74px 74px;gap:9px;align-items:center;padding:10px 11px;border:1px solid var(--line);border-radius:11px;background:var(--panel2)}.book-row.selected{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--soft)}.book-row select,.book-row button{padding:6px 8px;font-size:12px}.book-row.archived{opacity:.56}
.gomoku-wrap{display:grid;grid-template-columns:minmax(0,560px) minmax(210px,1fr);gap:20px;align-items:start}.board{display:grid;grid-template-columns:repeat(9,1fr);aspect-ratio:1;max-width:560px;padding:10px;border:1px solid #b48755;border-radius:10px;background:#d9ae72}.cell{position:relative;border:0;border-radius:0;padding:0;background:transparent;color:transparent}.cell:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:#4d321d7a;transform:translateX(-50%)}.cell:after{content:"";position:absolute;top:50%;left:0;right:0;height:1px;background:#4d321d7a;transform:translateY(-50%)}.cell:hover{background:#ffffff2b}.cell.last{background:#fff6c575}.cell.suggest{background:#565bd64a}.stone{position:absolute;z-index:1;left:50%;top:50%;width:73%;height:73%;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 2px 4px #24191033}.stone.black{background:#20242c}.stone.white{background:#f8f8f4;border:1px solid #adb0b7}.game-side{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}.game-side h3{margin:0 0 7px}.game-side p{margin:5px 0;color:var(--muted)}
.agent{display:flex;flex-direction:column;min-width:0;overflow:hidden;opacity:1;transform:translateX(0);transition:opacity var(--dur-panel) var(--ease),transform var(--dur-panel) var(--ease)}.layout.closed .agent{opacity:0;transform:translateX(10px);pointer-events:none}.agent-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 15px;border-bottom:1px solid var(--line)}.agent-heading{display:flex;align-items:center;gap:9px}.agent-mark{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--soft);color:var(--accent);font-weight:900}.agent-title{font-weight:800}.agent-sub{color:var(--muted);font-size:12px}.agent-head-actions{display:flex;align-items:center;gap:5px}.agent-context{padding:11px 13px;border-bottom:1px solid var(--line);background:var(--panel2)}.context-line{margin-bottom:7px;color:var(--muted);font-size:12px}.context-line strong{color:var(--ink)}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:4px 7px;border-radius:7px;background:var(--soft);color:#464ba8;font:11px var(--mono)}.live-change{margin-top:8px;padding:7px 8px;border-left:3px solid var(--green);background:var(--greenbg);color:var(--green);font-size:12px}.messages{flex:1;min-height:390px;padding:14px;overflow:auto}.msg{max-width:94%;margin-bottom:10px;padding:10px 11px;border-radius:12px;white-space:pre-wrap}.msg.user{margin-left:auto;background:var(--accent);color:#fff;border-bottom-right-radius:4px}.msg.assistant{border:1px solid var(--line);background:var(--panel2);border-bottom-left-radius:4px}.msg.event{max-width:100%;padding:7px 9px;background:var(--greenbg);color:var(--green);font-size:12px;border-radius:8px}.action{margin-top:8px;padding:9px;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-size:12px}.action strong{display:block}.action code{display:block;margin-top:6px;padding:7px;border-radius:7px;background:#f0f1f7;color:#4b536d;font:11px var(--mono);white-space:pre-wrap}.action em{display:block;margin-top:6px;color:var(--green);font-style:normal}.composer{display:flex;gap:7px;padding:11px;border-top:1px solid var(--line)}.composer input{flex:1;min-width:0}.agent-foot{padding:8px 13px;border-top:1px solid var(--line);background:#fcfcfe;color:var(--muted);font-size:11px}.empty{padding:18px;border:1px dashed var(--line);border-radius:11px;color:var(--muted);text-align:center}
@media(max-width:980px){.layout,.layout.closed{grid-template-columns:1fr}.agent{min-height:610px}.layout.closed .agent{display:none}}@media(max-width:760px){.shell{padding:12px}.head{display:block}.head-actions{margin-top:12px;justify-content:start}.legend{justify-content:start;margin-top:9px}.surface{min-height:620px;padding:14px}.surface-head{display:block}.surface-actions{justify-content:start;margin-top:10px}.book-row{grid-template-columns:minmax(0,1fr) 88px 64px}.book-row .book-reads{display:none}.gomoku-wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
<header class="head"><div><div class="eyebrow">Shared Extension Surface</div><h1>扩展 Agent 共享操作示例</h1><p>主界面和 AI 侧边栏连接同一个扩展状态。人可以直接操作，AI 也能读取当前状态并调用同一套领域操作。</p></div><div class="head-actions"><button class="primary" id="toggle-agent">隐藏 AI</button><div class="legend"><span>当前扩展状态</span><span>同一套操作</span><span>实时回写</span></div></div></header>
<nav class="tabs" id="tabs" aria-label="扩展示例"></nav>
<div class="layout" id="layout"><main class="surface" id="surface"></main><aside class="agent"><div class="agent-head"><div class="agent-heading"><div class="agent-mark">AI</div><div><div class="agent-title">扩展 AI</div><div class="agent-sub" id="agent-sub"></div></div></div><div class="agent-head-actions"><span class="tag green">已连接</span><button class="icon ghost" id="close-agent" title="关闭 AI 侧边栏">×</button></div></div><div class="agent-context" id="agent-context"></div><div class="messages" id="messages"></div><div class="composer"><input id="prompt" placeholder="直接问 AI 操作当前扩展"><button class="primary" id="send">发送</button></div><div class="agent-foot">状态、查询、操作和结果来自当前扩展实例，侧边栏可以随时打开</div></aside></div>
</div>
<script>
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=p=>p+Math.random().toString(36).slice(2,8),$=id=>document.getElementById(id);
const daily={tasks:[{id:'d1',title:'整理本周发布说明',day:'今天',done:false},{id:'d2',title:'回复设计评审意见',day:'今天',done:true},{id:'d3',title:'准备迭代复盘材料',day:'明天',done:false}],yesterday:['完成扩展 Agent 架构调研','和设计确认侧边栏交互方向','修复会话列表的滚动问题'],selectedTaskId:null,lastChange:{actor:'system',text:'日报已打开'}};
const gomoku={size:9,board:Array.from({length:9},()=>Array(9).fill(null)),turn:'black',history:[],selectedCell:null,suggestion:null,lastChange:{actor:'system',text:'棋局已打开'}};
const books={categories:['未分类','小说','经济','技术','历史'],rows:[{id:'b1',title:'置身事内',author:'兰小欢',type:'未分类',progress:78,reads:5,summary:'从地方治理和经济运行的角度，解释中国经济生活中的制度与组织。'},{id:'b2',title:'人类简史',author:'尤瓦尔·赫拉利',type:'历史',progress:42,reads:3,summary:'从认知革命、农业革命和科学革命回看人类社会的形成。'},{id:'b3',title:'编码：隐匿在计算机软硬件背后的语言',author:'Charles Petzold',type:'技术',progress:64,reads:7,summary:'从电报、继电器和布尔逻辑出发，解释计算机如何表示和处理信息。'},{id:'b4',title:'百年孤独',author:'加西亚·马尔克斯',type:'未分类',progress:22,reads:2,summary:'布恩迪亚家族七代人的命运与马孔多小镇的兴衰。'}],selectedBookId:'b1',lastChange:{actor:'system',text:'书架已打开'}};
const meta={daily:{name:'日报',desc:'把工作记录和待办放在同一个可操作的日程里。人可以勾选和新增，AI 可以直接查询和写入。'},gomoku:{name:'五子棋',desc:'人和 AI 共享同一盘棋。人点击棋盘落子，AI 读取二维矩阵并通过同一个落子操作继续对局。'},books:{name:'书架',desc:'浏览、分类和归档书籍。AI 自动感知当前选中书籍和阅读记录，整理结果会直接回到书架。'}};
const messages={daily:[],gomoku:[],books:[]};let current='daily',agentOpen=true;
const state=()=>current==='daily'?daily:current==='gomoku'?gomoku:books,name=()=>meta[current].name,actor=a=>a==='agent'?'AI':'人';
function change(text,a){state().lastChange={actor:a,text};}
function add(role,text,extra=''){messages[current].push({role,text,extra});renderMessages()}
function card(tool,args,result){return '<div class="action"><strong>'+esc(tool)+'</strong><code>'+esc(JSON.stringify(args,null,2))+'</code><em>'+esc(result)+'</em></div>'}
function metric(v,l){return '<div class="metric"><b>'+esc(v)+'</b><small>'+esc(l)+'</small></div>'}
function activity(s){return '<div class="activity"><span>最近变化</span><strong>'+esc(actor(s.lastChange.actor)+' · '+s.lastChange.text)+'</strong></div>'}
function tabs(){$('tabs').innerHTML=Object.entries(meta).map(([id,x])=>'<button data-app="'+id+'" class="'+(id===current?'active':'')+'">'+x.name+'</button>').join('');$('tabs').querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>switchApp(b.dataset.app))}
function dailyView(){const done=daily.tasks.filter(x=>x.done).length,open=daily.tasks.length-done;return '<div class="surface-head"><div><div class="surface-title">日报</div><div class="surface-description">'+meta.daily.desc+'</div></div><div class="surface-actions"><button id="daily-summary">生成今日摘要</button></div></div><div class="metric-row">'+metric(daily.tasks.length,'全部待办')+metric(open,'未完成')+metric(done,'已完成')+'</div><div class="label">今天和明天</div><div class="task-list">'+daily.tasks.map(t=>'<div class="task-row '+(t.id===daily.selectedTaskId?'selected ':'')+(t.done?'done':'')+'"><button class="task-check '+(t.done?'checked':'')+'" data-task-toggle="'+t.id+'">'+(t.done?'✓':'')+'</button><div class="task-main" data-task-select="'+t.id+'"><div class="task-title">'+esc(t.title)+'</div><div class="task-meta">'+esc(t.day)+'</div></div></div>').join('')+'</div><div class="add-row"><input id="daily-input" placeholder="新增一个明天的待办"><button class="primary" id="daily-add">添加待办</button></div>'+activity(daily)+'<div class="notice">主界面和 AI 都调用 <code>daily.toggleTodo</code>、<code>daily.addTodo</code>。</div>'}
function gomokuView(){let cells='';for(let r=0;r<9;r++)for(let c=0;c<9;c++){const v=gomoku.board[r][c],last=gomoku.history[gomoku.history.length-1],isLast=last&&last.row===r&&last.col===c,s=gomoku.suggestion&&gomoku.suggestion.row===r&&gomoku.suggestion.col===c;cells+='<button class="cell '+(isLast?'last ':'')+(s?'suggest':'')+'" data-cell="'+r+','+c+'" aria-label="'+r+'行'+c+'列">'+(v?'<span class="stone '+v+'"></span>':'')+'</button>'}const b=gomoku.history.filter(x=>x.value==='black').length,w=gomoku.history.filter(x=>x.value==='white').length;return '<div class="surface-head"><div><div class="surface-title">五子棋</div><div class="surface-description">'+meta.gomoku.desc+'</div></div><div class="surface-actions"><button id="gomoku-suggest">让 AI 推荐一步</button><button id="gomoku-reset">重新开始</button></div></div><div class="metric-row">'+metric(gomoku.turn==='black'?'黑':'白','当前回合')+metric(gomoku.history.length,'已落子')+metric(b+' / '+w,'黑 / 白')+'</div><div class="gomoku-wrap"><div class="board">'+cells+'</div><div class="game-side"><h3>当前棋局</h3><p>轮到 <strong>'+esc(gomoku.turn==='black'?'黑方':'白方')+'</strong>。点击棋盘即可直接落子。</p><p class="small">蓝色格子是 AI 最近推荐的位置。AI 读取的是棋盘矩阵、回合和落子历史。</p><div class="notice">人和 AI 都调用 <code>gomoku.placeStone</code>，结果立即回到棋盘。</div></div></div>'+activity(gomoku)}
function booksView(){const un=books.rows.filter(x=>x.type==='未分类').length,sel=books.rows.find(x=>x.id===books.selectedBookId);return '<div class="surface-head"><div><div class="surface-title">书架</div><div class="surface-description">'+meta.books.desc+'</div></div><div class="surface-actions"><button id="books-organize" class="primary">按类型整理</button></div></div><div class="metric-row">'+metric(books.rows.length,'全部书籍')+metric(un,'未分类')+metric(books.rows.reduce((s,x)=>s+x.reads,0),'阅读次数')+'</div><div class="label">书籍列表</div><div class="book-list">'+books.rows.map(x=>'<div class="book-row '+(x.id===books.selectedBookId?'selected ':'')+(x.archived?'archived':'')+'" data-book-select="'+x.id+'"><div><div class="book-title">'+esc(x.title)+'</div><div class="book-author">'+esc(x.author)+' · 阅读 '+x.reads+' 次 · '+x.progress+'%</div></div><select data-book-category="'+x.id+'">'+books.categories.map(c=>'<option '+(c===x.type?'selected':'')+'>'+esc(c)+'</option>').join('')+'</select><div class="book-reads"><span class="tag '+(x.type==='未分类'?'orange':'green')+'">'+esc(x.type)+'</span></div><button data-book-archive="'+x.id+'">'+(x.archived?'已归档':'归档')+'</button></div>').join('')+'</div><div class="label">当前选中</div><div class="empty">'+(sel?'<strong>'+esc(sel.title)+'</strong><br><span class="small">'+esc(sel.summary)+'</span>':'点击一本书，AI 会自动获得当前选中状态')+'</div>'+activity(books)+'<div class="notice">主界面分类和归档，以及 AI 的整理动作，都调用同一套书籍操作。</div>'}
function surface(){$('surface').innerHTML=current==='daily'?dailyView():current==='gomoku'?gomokuView():booksView();bindSurface()}
function context(){let chips,line;if(current==='daily'){chips=['tasks:'+daily.tasks.length,'open:'+daily.tasks.filter(x=>!x.done).length,'selection:'+(daily.selectedTaskId||'none')];line='日报状态自动同步，包含今天和明天的待办'}else if(current==='gomoku'){chips=['board:9x9','turn:'+(gomoku.turn==='black'?'black':'white'),'moves:'+gomoku.history.length,'selection:'+(gomoku.selectedCell?gomoku.selectedCell.row+','+gomoku.selectedCell.col:'none')];line='棋盘矩阵、回合和落子历史自动同步'}else{const s=books.rows.find(x=>x.id===books.selectedBookId);chips=['books:'+books.rows.length,'unclassified:'+books.rows.filter(x=>x.type==='未分类').length,'selected:'+(s?s.title:'none')];line='书籍列表、阅读记录和当前选中项自动同步'}const c=state().lastChange;return '<div class="context-line"><strong>AI 已连接到「'+esc(name())+'」</strong><br>'+esc(line)+'</div><div class="chips">'+chips.map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+'</div><div class="live-change">最近变化 · '+esc(actor(c.actor)+' · '+c.text)+'</div>'}
function contextView(){$('agent-context').innerHTML=context();$('agent-sub').textContent='绑定当前扩展实例'}
function renderMessages(){const list=messages[current];$('messages').innerHTML=list.length?list.map(x=>x.role==='event'?'<div class="msg event">'+esc(x.text)+'</div>':'<div class="msg '+x.role+'">'+esc(x.text)+(x.extra||'')+'</div>').join(''):'<div class="empty">侧边栏已连接到当前扩展。你可以直接提问，也可以让 AI 执行操作。</div>';$('messages').scrollTop=$('messages').scrollHeight}
function render(){tabs();surface();contextView();renderMessages();$('layout').classList.toggle('closed',!agentOpen);$('toggle-agent').textContent=agentOpen?'隐藏 AI':'打开 AI'}
function switchApp(id){current=id;if(!messages[id].length)add('assistant','我是「'+meta[id].name+'」里的 AI。当前状态已经自动连接，你可以直接问我或让我执行操作。');render()}
function dispatch(action,args,who){let result='';if(action==='daily.toggleTodo'){const t=daily.tasks.find(x=>x.id===args.id);if(!t)return{ok:false,message:'待办不存在'};t.done=!t.done;daily.selectedTaskId=t.id;result=(t.done?'已完成「':'已重新打开「')+t.title+'」';change(result,who)}else if(action==='daily.addTodo'){const t={id:uid('d'),title:args.title||'准备明日计划',day:'明天',done:false};daily.tasks.push(t);daily.selectedTaskId=t.id;result='已新增明天待办「'+t.title+'」';change(result,who)}else if(action==='gomoku.placeStone'){const r=args.row,c=args.col;if(r<0||r>=9||c<0||c>=9||gomoku.board[r][c])return{ok:false,message:'这个位置不能落子'};gomoku.board[r][c]=gomoku.turn;gomoku.history.push({row:r,col:c,value:gomoku.turn});gomoku.selectedCell={row:r,col:c};gomoku.suggestion=null;result='已在 '+r+' 行 '+c+' 列落下 '+(gomoku.turn==='black'?'黑':'白')+' 子';gomoku.turn=gomoku.turn==='black'?'white':'black';change(result,who)}else if(action==='gomoku.reset'){gomoku.board=Array.from({length:9},()=>Array(9).fill(null));gomoku.history=[];gomoku.turn='black';gomoku.selectedCell=null;gomoku.suggestion=null;result='棋局已重新开始';change(result,who)}else if(action==='books.moveBook'){const b=books.rows.find(x=>x.id===args.id);if(!b)return{ok:false,message:'书籍不存在'};b.type=args.type;books.selectedBookId=b.id;result='已将「'+b.title+'」归入「'+b.type+'」';change(result,who)}else if(action==='books.archiveBook'){const b=books.rows.find(x=>x.id===args.id);if(!b)return{ok:false,message:'书籍不存在'};b.archived=true;books.selectedBookId=b.id;result='已归档「'+b.title+'」';change(result,who)}else if(action==='books.organizeByType'){const map={置身事内:'经济',百年孤独:'小说'};let n=0;books.rows.forEach(b=>{if(b.type==='未分类'){b.type=map[b.title]||'技术';n++}});result='已按类型整理 '+n+' 本书';change(result,who)}render();return{ok:true,message:result}}
function bindSurface(){$('surface').querySelectorAll('[data-task-toggle]').forEach(b=>b.onclick=()=>dispatch('daily.toggleTodo',{id:b.dataset.taskToggle},'human'));$('surface').querySelectorAll('[data-task-select]').forEach(x=>x.onclick=()=>{daily.selectedTaskId=x.dataset.taskSelect;change('选中了一个待办','human');render()});const addBtn=$('daily-add');if(addBtn)addBtn.onclick=()=>{const i=$('daily-input'),t=i.value.trim();if(t)dispatch('daily.addTodo',{title:t},'human')};const sum=$('daily-summary');if(sum)sum.onclick=()=>promptAI('帮我生成今天的摘要',true);$('surface').querySelectorAll('[data-cell]').forEach(b=>b.onclick=()=>{const [r,c]=b.dataset.cell.split(',').map(Number);dispatch('gomoku.placeStone',{row:r,col:c},'human')});const sug=$('gomoku-suggest');if(sug)sug.onclick=()=>promptAI('我接下来该怎么下',true);const reset=$('gomoku-reset');if(reset)reset.onclick=()=>dispatch('gomoku.reset',{},'human');$('surface').querySelectorAll('[data-book-select]').forEach(x=>x.onclick=()=>{books.selectedBookId=x.dataset.bookSelect;change('选中了「'+books.rows.find(b=>b.id===books.selectedBookId).title+'」','human');render()});$('surface').querySelectorAll('[data-book-category]').forEach(s=>s.onchange=e=>{e.stopPropagation();dispatch('books.moveBook',{id:s.dataset.bookCategory,type:s.value},'human')});$('surface').querySelectorAll('[data-book-archive]').forEach(b=>b.onclick=e=>{e.stopPropagation();dispatch('books.archiveBook',{id:b.dataset.bookArchive},'human')});const org=$('books-organize');if(org)org.onclick=()=>promptAI('整理下我的书架，按类型分类',true)}
function suggest(){const center=4,legal=[];for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(!gomoku.board[r][c])legal.push({row:r,col:c});legal.sort((a,b)=>Math.abs(a.row-center)+Math.abs(a.col-center)-Math.abs(b.row-center)-Math.abs(b.col-center));return legal[0]||null}
function promptAI(text,button=false){if(!button)add('user',text);if(current==='daily'){if(/昨天.*干|昨天.*做|工作记录|日报摘要/.test(text)){add('assistant','我读取了昨天的日报状态。你完成了 '+daily.yesterday.length+' 项工作：\n'+daily.yesterday.map(x=>'· '+x).join('\n'),card('daily.getYesterday',{day:'昨天'},'返回昨天的工作记录'));return}if(/未完成|没完成|待办/.test(text)&&!/加.*待办/.test(text)){const open=daily.tasks.filter(x=>!x.done);add('assistant',open.length?'还有 '+open.length+' 项未完成待办：\n'+open.map(x=>'· '+x.title+'（'+x.day+'）').join('\n'):'当前没有未完成待办。',card('daily.listTodos',{status:'open'},'返回当前未完成待办'));return}if(/加.*待办|新增.*待办|明天.*待办/.test(text)){const m=text.match(/待办[：: ]*(.+)$/),title=m&&m[1]?m[1].replace(/[。！？]+$/,''):'准备明日计划',r=dispatch('daily.addTodo',{title},'agent');add('assistant',r.message,card('daily.addTodo',{title,day:'明天'},r.message));add('event','AI 已写入日报，主界面已刷新');return}add('assistant','我可以读取昨天的工作、查询未完成待办，也可以直接新增明天的待办。');return}if(current==='gomoku'){if(/两步|2步/.test(text)){const moves=[];for(let i=0;i<2;i++){const m=suggest();if(!m)break;const r=dispatch('gomoku.placeStone',m,'agent');if(r.ok)moves.push(m.row+'行'+m.col+'列')}add('assistant',moves.length?'我通过同一个落子操作完成了 '+moves.length+' 步：'+moves.join('、'):'棋盘没有可落子位置。',card('gomoku.placeStone',{count:moves.length},'棋盘已同步更新'));add('event','AI 的落子已经回写到棋盘');return}if(/怎么下|接下来|推荐/.test(text)){const m=suggest();if(m){gomoku.suggestion=m;change('AI 推荐了 '+m.row+' 行 '+m.col+' 列','agent');render();add('assistant','建议落在 '+m.row+' 行 '+m.col+' 列。我先标出这个位置，是否落子由你决定。',card('gomoku.suggestMove',m,'推荐位置已标在棋盘上'));}else add('assistant','棋盘没有可落子位置。');return}if(/分析|局势|情况/.test(text)){const b=gomoku.history.filter(x=>x.value==='black').length,w=gomoku.history.filter(x=>x.value==='white').length;add('assistant','当前棋盘已有 '+gomoku.history.length+' 子，黑方 '+b+' 子，白方 '+w+' 子。现在轮到 '+(gomoku.turn==='black'?'黑方':'白方')+'。我可以继续给出下一步建议，或直接替你落子。',card('gomoku.analyze',{board:gomoku.board,turn:gomoku.turn},'读取棋盘矩阵、回合和落子历史'));return}add('assistant','我可以分析当前局势、推荐下一步，或通过同一个落子操作帮你下两步。');return}const selected=books.rows.find(x=>x.id===books.selectedBookId);if(/整理|分类/.test(text)){const r=dispatch('books.organizeByType',{},'agent');add('assistant',r.message,card('books.organizeByType',{scope:'all'},r.message));add('event','AI 已整理书架，分类结果已回写');return}if(/最近.*看|阅读.*多|读.*多/.test(text)){const top=[...books.rows].sort((a,b)=>b.reads-a.reads)[0];add('assistant','你最近看得最多的是「'+top.title+'」，累计阅读 '+top.reads+' 次，当前进度 '+top.progress+'%。',card('books.readingStats',{orderBy:'reads'},'返回阅读次数和进度'));return}if(/主要内容|讲了什么|内容/.test(text)){add('assistant',selected?'「'+selected.title+'」主要内容是：'+selected.summary:'请先在书架里选中一本书，我会自动读取当前选中项。',selected?card('books.getSummary',{bookId:selected.id},'读取当前选中书籍的摘要'):'');return}if(/归档/.test(text)&&selected){const r=dispatch('books.archiveBook',{id:selected.id},'agent');add('assistant',r.message,card('books.archiveBook',{bookId:selected.id},r.message));add('event','AI 已归档当前选中的书');return}add('assistant','我可以按类型整理书架、统计最近阅读次数，或读取当前选中书籍的主要内容。')}
$('toggle-agent').onclick=()=>{agentOpen=!agentOpen;render()};$('close-agent').onclick=()=>{agentOpen=false;render()};$('send').onclick=()=>{const i=$('prompt'),t=i.value.trim();if(t){i.value='';promptAI(t)}};$('prompt').onkeydown=e=>{if(e.key==='Enter')$('send').click()};switchApp(current);
</script>
