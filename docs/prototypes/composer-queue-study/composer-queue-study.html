:root {

  /* ===== 框与页（Frame & Sheet，design.md §1.1）：框 = 导航底色，页 = 连续阅读面 ===== */
  --frame-gap: 8px; /* 工作面外缘与侧栏列表共用的最终可见留白，避免内外层叠加。 */
  --bg-frame: #202023; /* F 框：顶栏/左栏共用稍亮的导航底色，可混入工作区色形成纯色 */
  --bg-canvas: #141416; /* L0 页内凹陷内容面：终端/编辑器/看板列井 */
  --bg-panel: #141416; /* L1 页：聊天/文件等阅读面加深，与终端/编辑器连续 */
  --bg-raised: #232326; /* L2 页内浮起物：卡片/工具条/代码块/气泡 */
  --bg-overlay: #262629; /* L3 脱离文档流浮层：菜单/popover/弹窗 */
  --bg-input: #161618; /* 输入控件：以轻微明度差与描边区分阅读面 */

  --ink: #ededee;
  --ink-soft: #d9d9dc;
  --text-2: #a3a3a8; /* 二级文字：说明/次要操作/图标默认色 */
  --text-3: #98989d; /* 三级文字仍需可读：占位/辅助 meta/分组标题 */
  /* 超椭圆 1px 实线会放像素锯齿：描边压暗、低对比，聚焦不提亮边 */
  --hairline: #2a2a2d;

  /* ===== 状态色（语义专用，不做装饰，design.md §1.3；薄荷绿系：浅、冷）===== */
  --green: #45d0a0;
  --yellow: #e8c65a;
  --red: #f3687b;
  --blue: #6cc2ff;
  --purple: #a88fff;

  /* ===== 工作区强调色（外观设置里的全局默认/工作区覆盖，workspaceAccent(id) 查表，App 写到 :root 内联）===== */
  --ws-accent: #8b7bff;
  --on-accent: #0f0f10;

  /* ===== 语法高亮（内容色，仅限代码/markdown 内容，design.md §1.4）===== */
  --syn-fg: #c9d1d9;
  --syn-muted: #8b949e;
  --syn-blue: #8ac6ff;
  --syn-cyan: #a5d8ff;
  --syn-red: #f88b9a;
  --syn-purple: #c3b1ff;
  --syn-orange: #ffb37d;
  --syn-yellow: #e8d47c;

  /* ===== 交互叠白（design.md §8：不换海拔不换色相）===== */
  --hover-fill: rgba(255, 255, 255, 0.05);
  --hover-fill-strong: rgba(255, 255, 255, 0.09);
  --selected-fill: rgba(255, 255, 255, 0.08);
  --selection-surface: color-mix(in srgb, var(--ink) 15%, transparent); /* 随明暗主题反向的中性选中叠层 */
  --bg-inset: rgba(127, 127, 127, 0.08); /* 凹陷/内嵌底（中性灰，不随色彩主题变） */

  /* 设置页阴影：1px 亮环 + 近层；主工作面与左栏不再挂独立页阴影。 */
  --shadow-page: 0 0 0 1px rgba(255, 255, 255, 0.06), 0 2px 6px rgba(0, 0, 0, 0.35);
  /* 卡片浮起：1px 亮环 + 近/远两层投影 */
  --shadow-card: 0 0 0 1px rgba(255, 255, 255, 0.06), 0 2px 6px rgba(0, 0, 0, 0.35), 0 16px 40px rgba(0, 0, 0, 0.28);
  --shadow-pop: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 20px 56px rgba(0, 0, 0, 0.6);
  /* 输入区采用纯色哑光面；保留旧主题键，默认取消光泽和投影。 */
  --shadow-input: none;

  /* 兼容旧组件的材质 token：统一为不透明实底，无背景模糊。 */
  --glass-sheet: var(--bg-panel);
  --glass-float: var(--bg-panel);
  --glass-blur: none;
  --input-surface: var(--bg-raised);
  --input-border: color-mix(in srgb, var(--ink) 6%, var(--hairline));
  --composer-chip: color-mix(in srgb, var(--ink) 5%, var(--input-surface));
  --composer-chip-hover: color-mix(in srgb, var(--ink) 9%, var(--input-surface));
  --skel-a: rgba(255, 255, 255, 0.04);
  --skel-b: rgba(255, 255, 255, 0.09);
  --scroll-thumb: #3a3a3e;
  --scroll-thumb-hover: #4c4c52;

  /* ===== 旧名兼容层（只映射，不新造值）===== */
  --canvas: var(--bg-canvas);
  --paper: var(--bg-raised);
  --surface-alt: var(--bg-panel);
  --bg: var(--bg-canvas);
  --bg-elevated: var(--bg-raised);
  --border: var(--hairline);
  --text: var(--ink);
  --text-dim: var(--text-2);
  --text-muted: var(--text-3); /* 修歧义：muted 比 dim 更弱一档 */
  --mid: var(--text-2); /* 旧名：二级文字/描边灰（修复历史悬空引用） */
  --accent: var(--ink);
  --accent-soft: var(--selected-fill);

  /* ===== 圆角：控件 8 / 卡与页 12 / 弹窗 16 / 胶囊（框与页：页与卡同档）===== */

  --radius-card: 12px;
  --radius-modal: 16px;

  /* type scale（字阶之外的字号一律不许新增）

   * 密度由行高/间距控制，不靠压字号——见 design.md §5 */

  /* 等宽栈：西文/数字走 Cascadia→Consolas（等宽不变）；三者均无中文字形，

  --z-overlay: 20;
  --z-dropdown: 40;
  --z-popover: 60;

  --focus-ring: none;

   * 入场签名（快起缓收，easeOutExpo 型）；退场统一更快；动画属性只许 transform/opacity/grid-template-rows。 */
  --ease-standard: cubic-bezier(0.16, 1, 0.3, 1); /* 入场：起步快、结尾长缓停 */
  --ease-exit: cubic-bezier(0.4, 0, 0.2, 1); /* 退场：缓起快收 */
  --ease-hover: ease-out; /* 微交互（hover/图标） */
  --ease-move: cubic-bezier(0.33, 0.1, 0.25, 1); /* 大位移（虚拟屏条带/工作区胶片） */
  --ease-loop: cubic-bezier(0.37, 0, 0.63, 1); /* 循环装饰（呼吸/轻浮；对称缓入缓出） */
  --dur-micro: 120ms; /* hover/图标旋转 */
  --dur-menu: 160ms; /* 菜单/小浮层 */

.tool-diff::-webkit-scrollbar-thumb:hover,
.tool-diff-raw::-webkit-scrollbar-thumb:hover,
.composer-editable::-webkit-scrollbar-thumb:hover,
.agent-preset-menu::-webkit-scrollbar-thumb:hover,
.create-ws-projects::-webkit-scrollbar-thumb:hover,
.agent-composer-qslane-list::-webkit-scrollbar-thumb:hover,
.agent-composer-qip-list::-webkit-scrollbar-thumb:hover,
.md-mermaid::-webkit-scrollbar-thumb:hover,
.memory-overview-card::-webkit-scrollbar-thumb:hover,
.memory-scroll::-webkit-scrollbar-thumb:hover,
.ma-scroll::-webkit-scrollbar-thumb:hover,
.ma-root .msheet::-webkit-scrollbar-thumb:hover,
.ma-files-list::-webkit-scrollbar-thumb:hover,
.ma-files-detail::-webkit-scrollbar-thumb:hover,
.ma-files-pre::-webkit-scrollbar-thumb:hover,
.tt-card-body::-webkit-scrollbar-thumb:hover,
.settings-tabpane::-webkit-scrollbar-thumb:hover,
.trace-scroll::-webkit-scrollbar-thumb:hover,
.trace-inspector-body::-webkit-scrollbar-thumb:hover,
.trace-inspector-pre::-webkit-scrollbar-thumb:hover,
.plan-card-body-scroll::-webkit-scrollbar-thumb:hover {
  background: var(--scroll-thumb-hover);
}

::-webkit-scrollbar-corner {
  background: transparent;
}

::-webkit-scrollbar-button,
::-webkit-scrollbar-button:start:decrement,
::-webkit-scrollbar-button:end:increment {
  display: none;
  width: 0;
  height: 0;
}

html,
body,
#root {
  height: 100%;
  overflow: hidden;
}

body {
  /* OPPO Sans 首选（本文件顶部 @font-face 经 OPPO 官网 CDN 加载）；离线/未加载时回退后续栈 */
  font-family: var(--font-sans);
  background: var(--bg-frame);
  color: var(--text);
  font-size: var(--font-body);
  letter-spacing: 0;
  -webkit-font-smoothing: antialiased;
}

/* 原生表单控件默认用 Arial/monospace，不自动继承 body 的 OPPO Sans。
   只统一字体族；代码编辑器等显式指定等宽字体的规则继续覆盖。 */
button,
input,
select,
textarea {
  font-family: inherit;
}

:focus {
  outline: none;
}

:focus-visible {
  outline: none;
}

/* ========== UI atoms（跨面板共用） ========== */

.ui-list {
  padding: 0 8px;
}

.ui-list-row {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  box-sizing: border-box;
  padding: 8px 12px;
  margin: 0;
  border: none;
  border-radius: var(--radius-control);
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.ui-list-row:hover {
  background: var(--hover-fill);
}

.ui-list-row.is-selected,
.ui-list-row.active {
  background: var(--accent-soft);
  color: var(--ink);
}

.ui-btn.danger,
.btn.danger {
  background: transparent;
  color: var(--red);
  border-color: color-mix(in srgb, var(--red) 45%, transparent);
}

.ui-btn.danger:hover:not(:disabled),
.btn.danger:hover:not(:disabled) {
  background: color-mix(in srgb, var(--red) 12%, transparent);
}

.ui-input.compact {
  border-radius: var(--radius-small);
  padding: 5px 10px;
  font-size: var(--font-ui);
  min-height: 28px;
}

.ui-menu {
  min-width: 140px;
  padding: 4px;
  background: var(--bg-overlay);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-pop);
}

/* ---------- 按钮（共享原子，design.md §9）：次按钮=淡填充底、无描边（框与页）；主/危险/幽灵在此分层 ---------- */
.ui-btn,
.btn,
.git-btn,
.task-toolbar-button,
.task-actions button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 1px solid transparent;
  background: var(--hover-fill);
  color: var(--text);
  border-radius: var(--radius-control);
  padding: 4px 12px;
  font: inherit;
  font-size: var(--font-control);
  font-weight: 500;
  cursor: pointer;
  min-height: 28px;
  box-sizing: border-box;
  transition: background-color var(--dur-micro) var(--ease-hover), border-color var(--dur-micro) var(--ease-hover);
}

.ui-btn:hover:not(:disabled),
.btn:hover:not(:disabled),
.git-btn:hover:not(:disabled),
.task-toolbar-button:hover:not(:disabled),
.task-actions button:hover:not(:disabled) {
  background: var(--hover-fill-strong);
}

.ui-btn.ghost:hover:not(:disabled),
.btn.ghost:hover:not(:disabled),
.git-btn.ghost:hover:not(:disabled) {
  background: var(--hover-fill);
}

.ui-btn:active:not(:disabled),
.btn:active:not(:disabled),
.git-btn:active:not(:disabled) {
  transform: scale(0.98);
}

.ui-btn:focus-visible,
.btn:focus-visible,
.git-btn:focus-visible,
.task-toolbar-button:focus-visible,
.task-actions button:focus-visible {
  border-color: var(--focus-border);
}

.ui-btn.primary,
.btn.primary,
.git-btn.primary,
.task-toolbar-button.primary,
.task-actions button.primary {
  background: var(--ink);
  color: var(--bg-canvas);
  border-color: transparent;
}

.ui-btn.primary:hover:not(:disabled),
.btn.primary:hover:not(:disabled),
.git-btn.primary:hover:not(:disabled),
.task-toolbar-button.primary:hover:not(:disabled),
.task-actions button.primary:hover:not(:disabled) {
  background: var(--ink-soft);
  color: var(--bg-canvas);
}

.ui-btn.ghost,
.btn.ghost,
.git-btn.ghost {
  border-color: transparent;
  background: transparent;
}

.ui-btn.ghost.is-on,
.git-btn.ghost.is-on,
.ui-btn.ghost.is-on:hover:not(:disabled),
.git-btn.ghost.is-on:hover:not(:disabled) {
  background: var(--selected-fill);
}

.ui-btn.tiny,
.git-btn.tiny {
  padding: 2px 8px;
  font-size: var(--font-caption);
  min-width: 22px;
  min-height: 24px;
  border-radius: var(--radius-control);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 2px;
}

.ui-btn:disabled,
.btn:disabled,
.git-btn:disabled,
.task-toolbar-button:disabled {
  opacity: var(--disabled-opacity);
  cursor: not-allowed;
}

/* ---------- 输入（共享原子）：凹槽底+hairline；focus 只换细描边，表面不动 ---------- */
.ui-input,
.git-repo-search,
.git-branch-search,
.git-hist-scope-search,
.session-header-search,
.ctrl-search,
input[type='search'].ctrl-search {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-control);
  color: var(--text);
  padding: 4px 10px;
  font: inherit;
  font-size: var(--font-control);
  outline: none;
  box-sizing: border-box;
  min-height: 28px;
}

.ui-input:focus,
.ui-input:focus-visible,
.git-repo-search:focus,
.git-branch-search:focus,
.git-hist-scope-search:focus,
.session-header-search:focus,
.ctrl-search:focus {
  border-color: var(--focus-border);
}

/* ---------- 统一搜索条（SearchBar）：悬浮条视觉（图标+输入+计数+操作） ---------- */
.search-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  min-width: 0;
  min-height: 32px;
  padding: 0 6px 0 10px;
  box-sizing: border-box;
  background: var(--bg-overlay);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-control);
  color: var(--text);
  transition: border-color var(--dur-micro) var(--ease-hover);
}

.search-bar:focus-within {
  border-color: var(--focus-border);
}

.search-bar.is-disabled {
  opacity: var(--disabled-opacity);
  pointer-events: none;
}

.search-bar-icon {
  display: inline-flex;
  flex-shrink: 0;
  color: var(--text-muted);
}

.search-bar:focus-within .search-bar-icon {
  color: var(--text-dim);
}

.search-bar-input {
  flex: 1;
  min-width: 0;
  border: none;
  background: transparent;
  color: inherit;
  font: inherit;
  font-size: var(--font-control);
  outline: none;
  padding: 4px 0;
}

.search-bar-input::placeholder {
  color: var(--text-muted);
}

.search-bar-input::-webkit-search-cancel-button,
.search-bar-input::-webkit-search-decoration {
  -webkit-appearance: none;
  appearance: none;
}

.search-bar-count {
  flex-shrink: 0;
  font-size: var(--font-caption);
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.search-bar-clear {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  padding: 0;
  border: none;
  border-radius: var(--radius-pill);
  --corner-shape: round;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
}

.search-bar-clear:hover {
  color: var(--text);
  background: var(--hover-fill);
}

.search-bar.is-float {
  width: min(520px, 92vw);
  min-width: 360px;
  box-shadow: var(--shadow-pop);
}

.search-bar-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  width: 24px;
  height: 24px;
  padding: 0;
  border: none;
  border-radius: var(--radius-small);
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  white-space: nowrap;
}

.search-bar-btn:hover:not(:disabled) {
  color: var(--text);
  background: var(--hover-fill);
}

.search-bar-btn.is-on {
  color: var(--text);
  background: var(--selected-fill);
}

.search-bar-btn:disabled {
  opacity: var(--disabled-opacity);
  cursor: default;
}

/* 图标槽基线：扩展一律用统一 IconPuzzle，不再透传扩展自带 emoji（用户验收口径） */

/* ---------- 自定义下拉（CustomSelect，替换原生 <select>；原生 option 面板无法纳入规范） ---------- */
.c-select-trigger {
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  width: 100%;
  box-sizing: border-box;
  min-height: 28px;
  padding: 4px 10px;
  border: 1px solid var(--hairline);
  border-radius: var(--radius-control);
  background: var(--bg-input);
  color: var(--text);
  font: inherit;
  font-size: var(--font-control);
  text-align: left;
  cursor: pointer;
}

.c-select-trigger:hover:not(:disabled) {
  background-image: linear-gradient(var(--hover-fill), var(--hover-fill));
}

.c-select-trigger:focus-visible {
  border-color: var(--focus-border);
  outline: none;
}

/* 只读态（编辑门外）与输入一致：透明底无边框保持可读 */
.c-select-trigger:disabled {
  color: var(--text-2);
  border-color: transparent;
  background: transparent;
  cursor: default;
}

.c-select-value {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.c-select-value.is-placeholder {
  color: var(--text-3);
}

.c-select-caret {
  flex-shrink: 0;
  color: var(--text-3);
  transition: transform var(--dur-micro) var(--ease-hover);
}

.c-select-caret.is-open {
  transform: rotate(180deg);
  color: var(--text-2);
}

.c-select-menu {
  position: fixed;
  /* 下拉 portal 到 body：须压过弹窗遮罩。新建任务已升到 --z-confirm（压看板），故 +1 */
  z-index: calc(var(--z-confirm) + 1);
  max-height: 260px;
  overflow-y: auto;
  padding: 4px;
  background: var(--bg-overlay);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-pop);
}

.c-select-item {
  display: flex;
  align-items: center;
  min-height: 28px;
  padding: 4px 10px;
  border-radius: var(--radius-control);
  color: var(--text-2);
  font-size: var(--font-control);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
}

.c-select-item.is-active {
  background: var(--hover-fill);
  color: var(--text);
}

.c-select-item.is-selected {
  background: var(--selected-fill);
  color: var(--text);
}

.c-select-group {
  padding: 8px 10px 4px;
  font-size: var(--font-caption);
  font-weight: 500;
  color: var(--text-3);
  letter-spacing: 0.02em;
}

.ui-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 32px 24px;
  text-align: center;
  color: var(--text-dim);
}

.ui-empty-title {
  margin: 0;
  font-size: var(--font-title);
  font-weight: 500;
  color: var(--text);
}

.ui-empty-desc {
  margin: 0;
  font-size: var(--font-control);
  line-height: 1.45;
  max-width: 28em;
}

.ui-empty-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
}

/* 框底随当前工作区色切换纯色；未启用工作区色时回到主题框色。 */
.app-shell {
  display: flex;
  flex-direction: column;
  height: 100%;
  background: var(--workspace-frame-color, var(--bg-frame));
}

/* 退出终端焦点后的按键落点：不在 .terminal-wrap 内，避免 isTerminalTarget 仍为真 */
.app-key-sink {
  position: fixed;
  width: 1px;
  height: 1px;
  opacity: 0;
  overflow: hidden;
  pointer-events: none;
}

.icon-btn.active {
  color: var(--accent);
  border-color: var(--accent);
}

/* ---------- 主视图：静态会话列 + 终端/Git 横向虚拟屏 + Agent 悬浮 ---------- */

.main-view {
  flex: 1;
  min-width: 0;
  min-height: 0;
  /* clip：禁止 scrollIntoView / 焦点把横向 scrollLeft 卷走（虚拟屏左缘被裁） */
  overflow-x: clip;
  overflow-y: hidden;
  position: relative;
  /* 共同框底始终露出底边，侧栏收起/划开时也不会被工作面盖住。 */
  background: var(--workspace-frame-color, var(--bg-frame));
  display: flex;
  flex-direction: row;
}

.work-area {
  flex: 0 0 auto;
  height: 100%;
  min-width: 0;
  min-height: 0;
  overflow-x: clip;
  overflow-y: hidden;
  position: relative;
  z-index: 1;
}

/* 会话 + 终端：虚拟屏同一页，一起平移 */
.workspace-page {
  display: flex;
  flex-direction: row;
  background: transparent;
  height: 100%;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  position: relative;
}

/* 左栏宽度手柄：骑在左栏右缘，拖动占中栏宽度（页总宽不变） */
.left-col-resizer {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 7px;
  /* left = 栏宽 = 左栏宿主右缘；命中区略偏左以便从左栏触达。 */
  transform: translateX(calc(-50% - 4px));
  z-index: var(--z-sticky);
  cursor: col-resize;
  touch-action: none;
}

.left-col-resizer::after {
  content: '';
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  width: 1px;
  transform: translateX(-50%);
  background: transparent;
  transition: background var(--dur-micro) var(--ease-hover);
}

.left-col-resizer:hover::after,
.left-col-resizer.is-resizing::after {
  background: var(--text-2);
}

.main-view.is-left-resizing {
  cursor: col-resize;
  user-select: none;
}

/* 专注模式（is-focus 由 App 按 focusMode && 非窄屏挂载）：只改主区几何（会话+Git
   并肩恒满全宽），**不再触碰会话栏显隐**——展开/折叠由右上角开关与左缘热区控制
   （与专注解耦，用户定稿）。左栏 DOM 常驻范式不变，React/终端状态零损失 */

/* 对话面板跟随侧边栏显隐（App 按 sidebarVisible 挂 sessions-hidden）：折叠态
   未速览时 .agent-float 根（对话面板 + 幽灵占位）display:none（React 状态保留，
   侧边栏再现即恢复）。工作区胶囊栈本体已 portal 进左栏槽位（.left-ws-slot），
   随侧边栏本体显隐，不再依赖本规则；「需要你」提醒由全局看板探条独立承担 */
.main-view.sessions-hidden .agent-float {
  display: none;
}

.h-strip {
  position: relative;
  left: 0;
  display: flex;
  flex-direction: row;
  height: 100%;
}

.h-strip.vs-axis {
  /* 仅虚拟屏平移时提升层，避免静态时 WebGL 长期吃 compositing */
  will-change: transform;
  transition: transform var(--dur-move) var(--ease-move);
}

/* 拖分割边界调大小时必须逐帧跟手：禁用条带平移过渡 */
.main-view.is-reshaping .h-strip.vs-axis {
  transition: none;
}

/* 拖动调宽期间（虚拟屏比例 / 左栏宽）掩盖重内容区逐帧重排掉帧：
 * 禁指针 + 微降不透明度做「调整中」示意；transition 只动 opacity（合成器友好） */
.main-view.is-reshaping .terminal-page,
.main-view.is-reshaping .git-page,
.main-view.is-left-resizing .terminal-page {
  pointer-events: none;
  opacity: 0.92;
}

.terminal-page,
.git-page {
  transition: opacity var(--dur-micro) var(--ease-hover);
}

/* 中栏与右页组成一块连续工作面。外缘只在当前激活侧露出；
 * 底部 8px 由 main-view 的框底统一提供。 */
.terminal-page {
  padding: 0;
}

.main-view.sessions-hidden:not(.h-git) .terminal-page {
  padding-left: var(--frame-gap);
}

.main-view.is-focus.sessions-hidden .terminal-page {
  padding-left: var(--frame-gap);
}

.git-page {
  padding: 0;
}

.main-view.h-git .git-page,
.main-view.is-focus .git-page {
  padding-right: var(--frame-gap);
}

.terminal-page > .center-panel,
.git-page > .side-tools-panel {
  border-radius: var(--radius-card);
  box-shadow: none;
  overflow: hidden;
  contain: layout paint;
}

.h-vs-on .terminal-page > .center-panel,
.main-view.is-focus .terminal-page > .center-panel {
  border-radius: var(--radius-card) 0 0 var(--radius-card);
}

.h-vs-on .git-page > .side-tools-panel,
.main-view.is-focus .git-page > .side-tools-panel {
  border-radius: 0 var(--radius-card) var(--radius-card) 0;
}

.ws-resize-ind-pos {
  position: absolute;
  top: 0;
  bottom: 0;
  z-index: var(--z-overlay);
  pointer-events: none;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: var(--bg-panel); /* 快照未就绪或 blur 边缘也不能透出正在重排的活内容 */
}

/* 拖动反馈用模糊快照完整遮住活内容；这是重排遮罩，不是窗口装饰材质。
 * overscan + 父层实底防止 blur 边缘透底。不能降低 opacity，否则会叠出两套文字。 */
.ws-resize-snap {
  position: absolute;
  inset: -14px;
  background-size: 100% 100%;
  background-position: center;
  filter: blur(8px) saturate(0.9);
  opacity: 1;
}

/* 与被调侧等宽高比的实底指示卡：随边界逐帧变比，比例一目了然。
 * 整体是一张圆角矩形（无外框线），内部 ▮▯▮ 三色段铺满、段间两道
 * 直切的缝，呼应终端空白页的占位图；外圈圆角由容器 overflow 裁出 */
@keyframes ws-resize-card-in {
  from {
    opacity: 0;
    transform: scale(0.96);
  }
}

.ws-resize-card {
  position: relative;
  z-index: 1; /* 绝对定位快照在普通流内容之后绘制，卡片须显式压在快照之上 */
  box-sizing: border-box;
  min-width: 170px;
  min-height: 96px;
  display: flex;
  flex-direction: row;
  align-items: stretch;
  gap: 10px;
  border-radius: var(--radius-modal);
  overflow: hidden;
  background: var(--bg-elevated);
  box-shadow: var(--shadow-pop);
  animation: ws-resize-card-in var(--dur-micro) var(--ease-hover);
}

/* 素色段 ▮：直角，外圈圆角由容器裁切 */
.ws-resize-card-bar {
  flex: 1;
  background: color-mix(in srgb, var(--text) 7%, transparent);
}

/* 着色段：直角，承载区域名 + 百分比 */
.ws-resize-card-mid {
  flex: 1.8;
  background: color-mix(in srgb, var(--focus-border) 24%, transparent);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.ws-resize-card-label {
  font-size: var(--font-caption);
  color: var(--text-dim);
  letter-spacing: 0.1em;
}

.ws-resize-card-num {
  font-size: 26px;
  font-weight: 500;
  color: var(--text);
  font-variant-numeric: tabular-nums;
  line-height: 1;
}

/* 拖大小时分割线转焦点色，提示边界正在被拖 */
.main-view.is-reshaping .pane-split-line {
  background: var(--focus-border);
}

.h-page {
  flex: 0 0 auto;
  height: 100%;
  min-height: 0;
  overflow: hidden;
  position: relative;
}

/*
 * 分割条：挂在 h-strip 内，跟虚拟屏 transform 一起动。
 * 整条只画线；出钮热区仅竖直居中一小条（.pane-split-zone）。
 * 全高 28px 隐形检测带（.pane-split-hit）：压线任意位置点亮中段幽灵胶囊，
 * 告知触发区所在；进入中段才召出按钮（.hot）。按钮是 zone 的子节点，
 * 指针移到按钮上不触发热区 leave，避免交替闪烁。
 */
.pane-split {
  position: absolute;
  z-index: var(--z-overlay);
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}

.pane-split-v {
  top: 0;
  bottom: 0;
  width: 28px;
  transform: translateX(-50%);
}

/* 双页共用工作面仍需可辨的虚拟屏边界；仅留 1px 极浅中性线。 */
.pane-split-line {
  background: color-mix(in srgb, var(--ink) 8%, transparent);
  pointer-events: none;
  opacity: 0.9;
  transition: background var(--dur-micro) var(--ease-hover), box-shadow var(--dur-micro) var(--ease-hover), opacity var(--dur-micro) var(--ease-hover);
}

.pane-split-v .pane-split-line {
  width: 1px;
  height: 100%;
}

.pane-split.line-hot .pane-split-line {
  background: var(--focus-border);
}

.pane-split.hot .pane-split-line {
  background: var(--text);
  opacity: 1;
}

.pane-split-v.hot .pane-split-line {
  width: 2px;
}

/* 全高隐形检测带：只负责压线点亮，不召出按钮 */
.pane-split-hit {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  bottom: 0;
  pointer-events: auto;
  cursor: default;
}

/* 中段触发区兼按钮锚点壳：按钮锚点（top: along%）相对它解析 */
.pane-split-zone {
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  height: min(160px, 30%);
  transform: translateY(-50%);
  pointer-events: auto;
  cursor: col-resize;
  border-radius: var(--radius-pill);
}

/* 幽灵胶囊：压线时揭示触发区范围，进入中段后加亮为准星 */
.pane-split-zone::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  border: 1px solid transparent;
  background: transparent;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--dur-micro) var(--ease-hover), background var(--dur-micro) var(--ease-hover), border-color var(--dur-micro) var(--ease-hover);
}

.pane-split.line-hot .pane-split-zone::before {
  opacity: 1;
  border-color: var(--border);
  background: color-mix(in srgb, var(--hover-fill) 60%, transparent);
}

/* 按钮召出后胶囊退场：热态只剩线体加亮与按钮本身 */
.pane-split.hot .pane-split-zone::before {
  opacity: 0;
}

.split-expand-anchor {
  position: absolute;
  left: 50%;
  width: 0;
  height: 0;
  z-index: var(--z-dropdown);
}

.split-expand-btn {
  position: absolute;
  left: 0;
  top: 0;
  z-index: var(--z-dropdown);
  transform: translate(-50%, -50%);
  pointer-events: auto;
  border: 1px solid var(--border);
  background: var(--bg-overlay);
  color: var(--text-2);
  border-radius: var(--radius-pill);
  --corner-shape: round;
  min-width: 28px;
  height: 24px;
  padding: 0 8px;
  font-size: var(--font-ui);
  line-height: 1;
  cursor: pointer;
  box-shadow: var(--shadow-pop);
  touch-action: none;
  user-select: none;
}

.split-expand-btn:hover {
  color: var(--text);
  border-color: var(--border);
  background: color-mix(in srgb, var(--bg-overlay) 92%, var(--hover-fill-strong));
}

.split-expand-btn.is-on {
  color: var(--text);
  border-color: var(--border);
}

.split-expand-btn.is-picking {
  cursor: grabbing;
  color: var(--text);
  background: color-mix(in srgb, var(--bg-overlay) 92%, var(--hover-fill-strong));
  box-shadow: var(--shadow-pop);
  z-index: calc(var(--z-dropdown) + 2);
}

.split-mode-drop {
  position: absolute;
  left: 0;
  top: 0;
  z-index: calc(var(--z-dropdown) + 1);
  pointer-events: none;
  min-width: 44px;
  height: 24px;
  padding: 0 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border);
  border-radius: var(--radius-control);
  background: var(--bg-overlay);
  color: var(--text-2);
  font-size: var(--font-caption);
  line-height: 1;
  box-shadow: var(--shadow-pop);
  white-space: nowrap;
}

.split-mode-drop.is-current {
  color: var(--text);
  border-color: var(--focus-border);
}

.split-mode-drop.is-armed {
  color: var(--text);
  background: color-mix(in srgb, var(--bg-overlay) 92%, var(--hover-fill-strong));
  border-color: var(--text);
}

/*
 * 长按调节指示：左右两个圆形图标，仅按拖动方向点亮（非落点）。
 */
.split-size-drop {
  position: absolute;
  left: 0;
  top: 0;
  z-index: calc(var(--z-dropdown) + 1);
  pointer-events: none;
  min-width: 24px;
  height: 24px;
  padding: 0 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  --corner-shape: round;
  background: var(--bg-overlay);
  color: var(--text-2);
  font-size: var(--font-ui);
  line-height: 1;
  box-shadow: var(--shadow-pop);
  transition: color var(--dur-micro) var(--ease-hover), background var(--dur-micro) var(--ease-hover), border-color var(--dur-micro) var(--ease-hover);
}

.split-size-drop.is-armed {
  color: var(--text);
  background: color-mix(in srgb, var(--bg-overlay) 92%, var(--hover-fill-strong));
}

/* 工作区整屏胶片：固定骨架 ↔ 实况纵向滑动（不截屏） */
.ws-stage {
  position: absolute;
  inset: 0 0 var(--frame-gap);
  z-index: 1;
  overflow-x: clip;
  overflow-y: hidden;
  transition: transform var(--dur-exit) var(--ease-exit);
}

.main-view.sessions-hidden .ws-stage {
  /* 盖住下层侧栏，同时让页面 padding 露出与窗口一致的框色。 */
  background: var(--workspace-frame-color, var(--bg-frame));
  border-radius: var(--radius-card) 0 0 var(--radius-card);
}

.main-view.h-git.sessions-hidden:not(.is-focus) .ws-stage {
  border-radius: 0;
}

.main-view.sessions-peek .ws-stage:not(.is-sliding) {
  transform: translateX(var(--sessions-col-w));
  transition: transform var(--dur-panel) var(--ease-standard);
}

.ws-stage.is-sliding {
  pointer-events: none;
}

.ws-stage .work-area {
  height: 100%;
}

.ws-rail {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  display: flex;
  flex-direction: column;
  will-change: transform;
}

.ws-rail.ws-rail-idle {
  height: 100%;
  transform: none;
}

.ws-rail.ws-rail-idle .ws-pane-skel {
  display: none;
}

.ws-rail.ws-rail-idle .ws-pane-live {
  flex: 1 1 auto;
  height: 100%;
}

.ws-rail.is-transit {
  height: 200%;
}

.ws-rail.is-transit .ws-pane {
  flex: 0 0 50%;
  height: 50%;
  overflow: hidden;
  position: relative;
}

/* DOM 固定 [骨架][实况]；from-above 时视觉上下对调 */
.ws-rail.dir-from-above {
  flex-direction: column-reverse;
}

.ws-rail.dir-from-below {
  flex-direction: column;
}

/*
 * from-above：translate 0 = 实况；-50% = 骨架
 * from-below：translate 0 = 骨架；-50% = 实况
 * arm → to-skel：滑到骨架；fade：停在骨架位，骨架淡出、实况淡入
 */
.ws-rail.dir-from-above.phase-arm {
  transition: none;
  transform: translate3d(0, 0, 0);
}

.ws-rail.dir-from-above.phase-to-skel {
  transition: transform var(--dur-move) var(--ease-move);
  transform: translate3d(0, -50%, 0);
}

.ws-rail.dir-from-below.phase-arm {
  transition: none;
  transform: translate3d(0, -50%, 0);
}

.ws-rail.dir-from-below.phase-to-skel {
  transition: transform var(--dur-move) var(--ease-move);
  transform: translate3d(0, 0, 0);
}

.ws-rail.dir-from-above.phase-fade,
.ws-rail.dir-from-below.phase-fade {
  transition: none;
  transform: none;
}

/* fade 阶段：骨架与实况叠在同一视口；实况在下保持不透明，只有上层（不透明底的）骨架
 * 淡出——若两层同时交叉淡化，交叉期总不透明度 <1 会透出框底 */
.ws-rail.phase-fade {
  height: 100% !important;
}

.ws-rail.phase-fade .ws-pane {
  flex: none !important;
  position: absolute !important;
  inset: 0;
  height: 100% !important;
}

.ws-rail.phase-fade .ws-pane-skel {
  z-index: 2;
  opacity: 0;
  transition: opacity var(--dur-exit) var(--ease-exit);
}

.ws-rail.phase-fade .ws-pane-live {
  z-index: 1;
}

.ws-pane-live {
  min-height: 0;
}

.ws-pane-skel {
  min-height: 0;
  background: var(--bg);
}

/* 拖拽中：全屏同向光标 + 禁选择，防止文字选中/指针闪烁 */
body.is-panel-resizing {
  cursor: nesw-resize;
  user-select: none;
}

/* 通用两栏拖拽分割 */
.split-pane {
  min-width: 0;
  min-height: 0;
  display: flex;
  overflow: hidden;
}

.split-pane-panel > .split-pane {
  flex: 1;
  min-width: 0;
  min-height: 0;
}

.split-pane-row {
  flex-direction: row;
}

/* reverse：主栏视觉换边（DOM 顺序不变，比例语义仍指主栏） */
.split-pane-row.is-reversed {
  flex-direction: row-reverse;
}

.split-pane-column {
  flex-direction: column;
}

.split-pane-panel {
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.split-pane-handle {
  flex: 0 0 6px;
  position: relative;
  z-index: 4;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: none;
  user-select: none;
}

.split-pane-handle-row {
  cursor: col-resize;
}

.split-pane-handle-column {
  cursor: row-resize;
}

.split-pane-handle-line {
  background: var(--border);
  pointer-events: none;
  transition: background var(--dur-micro) var(--ease-hover), width var(--dur-micro) var(--ease-hover), height var(--dur-micro) var(--ease-hover),
    box-shadow var(--dur-micro) var(--ease-hover);
}

.split-pane-handle-row .split-pane-handle-line {
  width: 1px;
  height: 100%;
}

.split-pane-handle-column .split-pane-handle-line {
  width: 100%;
  height: 1px;
}

.split-pane-handle.is-hot .split-pane-handle-line,
.split-pane-handle:hover .split-pane-handle-line {
  background: var(--text);
  box-shadow: 0 0 6px color-mix(in srgb, var(--text) 30%, transparent);
}

.split-pane-handle-row.is-hot .split-pane-handle-line,
.split-pane-handle-row:hover .split-pane-handle-line {
  width: 2px;
}

.split-pane-handle-column.is-hot .split-pane-handle-line,
.split-pane-handle-column:hover .split-pane-handle-line {
  height: 2px;
}

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px 6px;
  font-size: var(--font-caption);
  font-weight: 500;
  color: var(--text-3);
  letter-spacing: 0.02em;
}

.runtime-menu {
  position: absolute;
  top: 100%;
  right: 0;
  z-index: var(--z-dropdown);
  min-width: 148px;
  /* padding-top 桥接按钮与菜单，避免移入时闪关 */
  padding: 6px 0 0;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity var(--dur-micro) var(--ease-hover), visibility var(--dur-micro) var(--ease-hover);
}

.panel-header.sub {
  margin-top: 16px;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
  background: var(--text-dim);
}

/* 兼容旧 class（若别处仍引用） */
.dot.running,
.dot.working {
  background: var(--text);
  opacity: 0.85;
}

.dot.starting {
  background: var(--text-dim);
}

.dot.idle {
  background: transparent;
  border: 1px solid var(--text-dim);
  box-sizing: border-box;
}

.dot.blocked {
  background: var(--text);
  opacity: 0.7;
}

/* 圆点脉冲：合成器友好版（transform/opacity）。当前无引用（历史遗留），
 * 若再启用需挂在圆点的 ::after 圆环上（参考 board.css 的 board-dot-pulse），
 * 原 box-shadow 扩散写法会逐帧重绘、掉帧成「一闪一闪」，不再使用 */
@keyframes dot-pulse {
  0% {
    transform: scale(1);
    opacity: 0.45;
  }
  70%,
  100% {
    transform: scale(2.4);
    opacity: 0;
  }
}

@keyframes dot-pulse-blocked {
  0% {
    transform: scale(1);
    opacity: 0.45;
  }
  70%,
  100% {
    transform: scale(2);
    opacity: 0;
  }
}

.dot.exited {
  background: var(--text-dim);
  opacity: 0.45;
}

.dot.scheduled {
  background: var(--yellow);
}

/* 运行态 spinner 唯一点（IconSpinner / .ui-spinner）：线宽与缺口走 --spinner-*，时长走 --dur-loop。
 * session-state-spin 是状态图标侧的别名，禁止再写第二套 keyframes / border 环。
 * 相位由 IconSpinner 按全局时钟写负 animation-delay 对齐，此处勿覆写 animation-delay。 */
.ui-spinner,
.session-state-spin {
  display: block;
  animation: session-state-spin var(--dur-loop) linear infinite;
  transform-origin: center;
  transform-box: view-box;
}

.ui-spinner circle {
  fill: none;
  stroke: currentColor;
  stroke-width: var(--spinner-stroke);
  stroke-linecap: round;
  stroke-dasharray: var(--spinner-dash);
}

@keyframes session-state-spin {
  to {
    transform: rotate(360deg);
  }
}

.empty-hint {
  color: var(--text-dim);
  font-size: var(--font-ui);
  padding: 10px 12px;
  line-height: 1.6;
}

/* ---------- 中栏 ---------- */

.center-panel {
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  position: relative;
  background: var(--bg-panel);
  display: flex;
  flex-direction: column;
}

/* 工具面板（任务/看板/统计/扩展…）统一覆盖层：presence 动画挂在层上，
 * 内部面板（prompt-task-panel 自带 absolute / board-panel 文档流）都填满本层。
 * 层不涂底，透出页的半透明底；改为把底下的终端/对话视图藏起（否则半透明底透出终端字），
 * 顺带让 xterm 画面退出合成。退场中（out）不再遮，终端与淡出的面板交叉淡入 */
.center-utility-layer {
  position: absolute;
  inset: 0;
  z-index: var(--z-sticky);
  display: flex;
  flex-direction: column;
}

.center-panel:has(> .center-utility-layer:not([data-mp-stage='out'])) > .xfade {
  opacity: 0;
  visibility: hidden;
  transition: none;
}

/* 先出后入（同 .xfade）：层不涂底，两层同时交叉淡化会叠印文字。换下的层 --dur-micro 快速
 * 淡出；有层在退场时，新层延迟 --dur-micro 的一半再入场。A→null 时终端 .xfade 自带同款延迟 */
.center-utility-layer.mp-panel[data-mp-stage='out'] {
  transition-duration: var(--dur-micro), var(--dur-micro);
}

.center-panel:has(> .center-utility-layer[data-mp-stage='out'])
  > .center-utility-layer.mp-panel[data-mp-stage='in'] {
  transition-delay: calc(var(--dur-micro) / 2);
}

@property --scan-r {
  syntax: '<length>';
  inherits: false;
  initial-value: 0px;
}

.center-placeholder {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  color: var(--text-dim);
}

/* 空状态品牌图标（环轨）：各空白页共用 */
.empty-logo {
  display: flex;
  justify-content: center;
}

code.ok {
  color: var(--green);
}

code.warn {
  color: var(--yellow);
}

.hint-muted {
  display: inline-block;
  margin-top: 8px;
  color: var(--text-dim);
  font-size: var(--font-ui);
}

.tool-capture-preview {
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  overflow: hidden;
  background: #000;
}

.tool-capture-preview img {
  display: block;
  width: 100%;
  height: auto;
}

.queued-box {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 4px;
  font-size: var(--font-ui);
  color: var(--text-dim);
}

.queued-cancel {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: var(--radius-control);
  padding: 2px 10px;
  font-size: var(--font-caption);
  cursor: pointer;
  transition: color var(--dur-micro) var(--ease-hover), border-color var(--dur-micro) var(--ease-hover);
}

.queued-cancel:hover {
  color: var(--red);
  border-color: color-mix(in srgb, var(--red) 45%, transparent);
}

.aborted-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 4px;
  font-size: var(--font-caption);
  color: var(--text-dim);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 2px 10px;
  user-select: none;
}

.utility-placeholder-empty {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 32px 24px;
  text-align: center;
}

/* ============================================================
 * 动画系统骨架（motion tokens 见 :root；调研与决策见
 * docs/audits/animation-system-research.md）。
 * 核心约定：进出场一律 transition（改目标值即从当前插值续走，
 * 反向打断天然成立），不用 keyframes；[data-mp-stage] 三态由
 * usePresence 驱动（components/motion.tsx）。
 * ============================================================ */

/* 弹窗/大面板：淡入 + 轻微上浮入场；退场反向更快 */
.mp-panel {
  transition:
    opacity var(--dur-panel) var(--ease-standard),
    transform var(--dur-panel) var(--ease-standard);
}

.mp-panel[data-mp-stage='enter'] {
  opacity: 0;
  transform: translateY(8px) scale(0.985);
  transition: none; /* 起始态：usePresence 在 layout 阶段落成计算样式后切 in 起播 */
}

.mp-panel[data-mp-stage='in'] {
  opacity: 1;
  transform: none;
}

.mp-panel[data-mp-stage='out'] {
  opacity: 0;
  transform: translateY(6px) scale(0.992);
  transition-duration: var(--dur-exit), var(--dur-exit);
  transition-timing-function: var(--ease-exit), var(--ease-exit);
  pointer-events: none; /* 退场层不可交互：既避免误点，也免去调用方闭包悬空 */
}

/* 顶部对齐浮层（命令面板等）：入场方向改为自上而下 */
.mp-panel-top[data-mp-stage='enter'] {
  transform: translateY(-8px) scale(0.99);
}

.mp-panel-top[data-mp-stage='out'] {
  transform: translateY(-6px) scale(0.995);
}

/* 菜单/小浮层：更快一档，位移更小（默认万向：scale+opacity，不带轴向位移） */
.mp-pop {
  transition:
    opacity var(--dur-menu) var(--ease-standard),
    transform var(--dur-menu) var(--ease-standard);
}

.mp-pop[data-mp-stage='enter'] {
  opacity: 0;
  transform: scale(0.98);
  transition: none;
}

.mp-pop[data-mp-stage='in'] {
  opacity: 1;
  transform: none;
}

.mp-pop[data-mp-stage='out'] {
  opacity: 0;
  transform: scale(0.985);
  transition-duration: var(--dur-micro), var(--dur-micro);
  transition-timing-function: var(--ease-exit), var(--ease-exit);
  pointer-events: none;
}

/* 向上弹出的菜单（composer 菜单等）：自下而上 4px 入场 */
.mp-pop-up[data-mp-stage='enter'] {
  transform: translateY(4px) scale(0.98);
}

.mp-pop-up[data-mp-stage='out'] {
  transform: translateY(2px) scale(0.985);
}

/* 全屏 scrim 遮罩：只动 opacity */
.mp-scrim {
  transition: opacity var(--dur-panel) var(--ease-standard);
}

.mp-scrim[data-mp-stage='enter'] {
  opacity: 0;
  transition: none;
}

.mp-scrim[data-mp-stage='in'] {
  opacity: 1;
}

.mp-scrim[data-mp-stage='out'] {
  opacity: 0;
  transition-duration: var(--dur-exit);
  transition-timing-function: var(--ease-exit);
  pointer-events: none;
}

/* 视图切换「先出后入」：常驻视图叠放互切（父容器挂 .xfade-stack 需 position:relative）。
 * 旧视图 --dur-micro 快速淡出，新视图等旧视图淡出过半再淡入——两屏文字不在同一时刻
 * 以可辨认的透明度叠印（同时交叉淡化会叠字）。叠放宿主底色须与所在页一致，否则
 * 两层之间的空档会闪出另一种底色。
 * visibility 延迟到 opacity 结束后切换：隐藏期不可交互/不可聚焦，切换期可过渡。 */
.xfade-stack {
  position: relative;
  flex: 1;
  min-height: 0;
  min-width: 0;
}

.xfade {
  position: absolute;
  inset: 0;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition:
    opacity var(--dur-micro) var(--ease-exit),
    visibility 0s linear var(--dur-micro);
}

.xfade.is-shown {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transition:
    opacity var(--dur-panel) var(--ease-standard) calc(var(--dur-micro) / 2),
    visibility 0s;
}

/* 高频切换（会话实例）瞬切：保留叠放保活结构，只去掉过渡 */
.xfade.xfade-instant,
.xfade.xfade-instant.is-shown {
  transition: none;
}

/* 嵌套不变量：外层 xfade 隐藏时，内层 is-shown 不得把可见/可命中写回去。
 * visibility 与 pointer-events 都能被后代显式覆盖——不补这条，隐藏页里
 * 常驻叠放（如未激活 Git 页的 .git-detail-pane.is-shown）会变成「看不见
 * 但吃掉点击/滚轮」的透明层。退场沿用延后 visibility 的时序，不破坏外层淡出 */
.xfade:not(.is-shown) .xfade.is-shown {
  visibility: hidden;
  pointer-events: none;
  transition:
    opacity var(--dur-micro) var(--ease-exit),
    visibility 0s linear var(--dur-micro);
}

/* 手风琴/折叠体：grid 行高过渡（内容保活、纯 transition 可打断）。
 * 用法：外壳 .acc（display:grid; grid-template-rows:0fr↔1fr）+ 内容 .acc-body（overflow:hidden; min-height:0） */
.acc {
  display: grid;
  transition:
    grid-template-rows var(--dur-panel) var(--ease-standard),
    opacity var(--dur-panel) var(--ease-standard);
}

.acc.is-open {
  grid-template-rows: 1fr;
}

/* 收起走退场档（更快、缓起快收） */
.acc:not(.is-open) {
  grid-template-rows: 0fr;
  opacity: 0;
  transition-duration: var(--dur-exit), var(--dur-exit);
  transition-timing-function: var(--ease-exit), var(--ease-exit);
}

.acc-body {
  overflow: hidden;
  min-height: 0;
}

/* 减弱动态：全部进出场退化为瞬时（token 换值一处生效，循环装饰类另行按需登记） */
@media (prefers-reduced-motion: reduce) {
  .mp-panel,
  .mp-pop,
  .mp-scrim,
  .xfade,
  .acc,
  .agent-float-panel,
  .agent-ws-stack-row,
  .agent-ws-stack-rest {
    transition: none !important;
  }

  .mp-panel[data-mp-stage='enter'],
  .mp-pop[data-mp-stage='enter'],
  .mp-scrim[data-mp-stage='enter'],
  .agent-float-panel.is-entering {
    opacity: 1;
    transform: none;
  }

  /* 全局兜底：循环装饰（spinner/shimmer/呼吸/跑马灯等）一并静止 */
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    transition-delay: 0s !important;
  }
}

.cq-question-study .ac-uq-actions, .cq-question-study .ac-uq-nav, .cq-question-study .ac-uq-submit { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.cq-question-study .ac-uq-actions { margin-top: 12px; gap: 8px; }
.cq-question-study .ac-uq-submit { margin-left: auto; }
.cq-question-study .ac-uq-actions button { min-height: 28px; padding: 4px 10px; border: 0; border-radius: 7px; color: var(--cq-secondary); background: var(--cq-capsule); font-size: 12px; }
.cq-question-study .ac-uq-actions .ac-approval-allow { color: var(--cq-input); background: var(--cq-text); }
.cq-question-study .ac-uq-actions button:disabled { opacity: .4; }
.cq-question-study .ac-uq-title { margin-bottom: 8px; }
.cq-question-study .ac-uq-settled-row { display: grid; gap: 3px; padding: 5px 0; }
.cq-question-study .ac-uq-settled-q { color: var(--cq-secondary); font-size: 12px; }
.cq-question-study .ac-uq-settled-a { color: var(--cq-text); font-size: 14px; }
.cq-composer-wrap { position: relative; }
.cq-command-chip { display: flex; align-items: center; gap: 5px; width: fit-content; padding: 2px 4px 2px 8px; margin-bottom: 8px; border-radius: 6px; color: var(--cq-secondary); background: var(--cq-capsule); font-size: 12px; }
.cq-command-chip .cq-icon { height: 20px; width: 20px; }
.cq-phrases-study .agent-composer-qip { position: absolute; bottom: calc(100% + 8px); left: 20px; right: 20px; z-index: 5; max-height: 290px; overflow-y: auto; padding: 10px; border: 1px solid var(--cq-line); border-radius: 14px; background: var(--cq-input); color: var(--cq-text); box-shadow: none; }
.cq-phrases-study .agent-composer-qip-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 4px 8px; font-size: 13px; }
.cq-phrases-study .agent-composer-qip-title { font-weight: 500; }
.cq-phrases-study .agent-composer-qip-add, .cq-phrases-study .agent-composer-qip-item-tools button { min-height: 24px; padding: 3px 7px; border: 0; border-radius: 6px; background: transparent; color: var(--cq-secondary); font-size: 12px; }
.cq-phrases-study .agent-composer-qip-add:hover, .cq-phrases-study .agent-composer-qip-item-tools button:hover { background: var(--cq-hover); color: var(--cq-text); }
.cq-phrases-study .agent-composer-qip-list { display: grid; gap: 3px; max-height: 210px; overflow-y: auto; }
.cq-phrases-study .agent-composer-qip-item { display: flex; align-items: center; gap: 6px; min-width: 0; padding: 7px 6px; border-radius: 8px; }
.cq-phrases-study .agent-composer-qip-item:hover, .cq-phrases-study .agent-composer-qip-item.is-active { background: var(--cq-capsule); }
.cq-phrases-study .agent-composer-qip-item-main { display: grid; gap: 3px; flex: 1; min-width: 0; padding: 0 4px; border: 0; background: transparent; color: var(--cq-text); text-align: left; }
.cq-phrases-study .agent-composer-qip-key { font-size: 13px; font-weight: 500; }
.cq-phrases-study .agent-composer-qip-val { color: var(--cq-secondary); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cq-phrases-study .agent-composer-qip-item-tools { display: flex; flex: none; gap: 3px; opacity: 0; }
.cq-phrases-study .agent-composer-qip-item:hover .agent-composer-qip-item-tools, .cq-phrases-study .agent-composer-qip-item:focus-within .agent-composer-qip-item-tools { opacity: 1; }
.cq-phrases-study .agent-composer-qip-empty { padding: 12px 4px; color: var(--cq-secondary); font-size: 12px; }
.cq-phrases-study .agent-composer-qip-form { display: grid; gap: 8px; }
.cq-phrases-study .agent-composer-qip-input, .cq-phrases-study .agent-composer-qip-value { width: 100%; padding: 8px 10px; border: 1px solid var(--cq-line); border-radius: 8px; background: var(--cq-reading); color: var(--cq-text); font-size: 13px; outline: none; }
.cq-phrases-study .agent-composer-qip-value { min-height: 86px; resize: vertical; }
.cq-phrases-study .agent-composer-qip-input:focus, .cq-phrases-study .agent-composer-qip-value:focus { border-color: var(--cq-focus); }
.cq-phrases-study .agent-composer-qip-form-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.cq-phrases-study .agent-composer-qip-form-hint { margin-right: auto; font-size: 11px; color: var(--cq-secondary); }
.cq-phrases-study .agent-composer-qip-form-actions button { min-height: 28px; padding: 4px 10px; border: 0; border-radius: 7px; background: var(--cq-capsule); color: var(--cq-text); font-size: 12px; }
.cq-phrases-study .agent-composer-qip-form-actions .agent-composer-qip-save { background: var(--cq-text); color: var(--cq-input); }
.cq-phrases-study .agent-composer-qip-form-actions button:disabled { opacity: .4; }
@media (hover: none) { .cq-phrases-study .agent-composer-qip-item-tools { opacity: 1; } }
@container (max-width: 380px) {
  .cq-compact-study .cq-context { display: none; }
  .cq-compact-study .cq-model { max-width: 80px; }
  .cq-compact-study .cq-toolbar, .cq-compact-study .cq-toolbar > div { gap: 6px; }
}
@container (max-width: 310px) {
  .cq-compact-study .cq-model { display: none; }
}
.cq-file { width: 252px; flex: none; border-left: 1px solid var(--cq-divider); border-radius: 0 12px 12px 0; background: var(--cq-reading); }
.cq-file > header { display: flex; gap: 12px; padding: 17px 20px; font-size: 12px; }
.cq-file > header span, .cq-file small { color: var(--cq-muted); }
.cq-file > div { padding: 30px 22px; font-size: 14px; line-height: 1.8; }
.cq-file h2 { font-size: 17px; font-weight: 500; margin: 8px 0 18px; }
.cq-file h3 { font-size: 14px; font-weight: 500; margin: 25px 0 7px; }
.cq-file p { color: var(--cq-secondary); }
.cq-narrow { width: 440px; max-width: 100%; }
.cq-narrow .cq-sidebar, .cq-narrow .cq-file { display: none; }
.cq-narrow .cq-workbench-body { padding-left: 8px; }
.cq-narrow .cq-chat { border-radius: 12px; }
.cq-study-foot { display: flex; justify-content: space-between; gap: 25px; font-size: 12px; color: var(--cq-muted); padding-top: 12px; min-height: 30px; }
.cq-study-foot > span:last-child { flex: none; }
.cq-menu { position: fixed; z-index: 100; min-width: 188px; padding: 5px; border-radius: 10px; border: 1px solid var(--cq-line); background: var(--cq-input); color: var(--cq-text); box-shadow: 0 4px 14px #0003; }
.cq-menu button { display: flex; width: 100%; align-items: center; gap: 9px; min-height: 31px; padding: 5px 10px; background: transparent; border: 0; border-radius: 5px; font-size: 13px; text-align: left; }
.cq-menu button:hover, .cq-menu button:focus-visible { background: var(--cq-hover); }
.cq-menu button:disabled { color: var(--cq-muted); opacity: .5; }
.cq-menu-sep { height: 1px; background: var(--cq-divider); margin: 4px 6px; }
@container (max-width: 440px) {
  .cq-composer-wrap { padding: 0 12px 12px; }
  .cq-transcript { padding: 18px 20px; }
  .cq-user-msg { margin-left: 12px; }
  .cq-queue-panel { padding-left: 9px; padding-right: 9px; }
  .cq-context > span { display: none; }
  .cq-toolbar, .cq-toolbar > div { gap: 7px; }
  .cq-draft { padding: 12px; }
  .cq-row-text { font-size: 13px; }
  .cq-row { gap: 3px; }
}
@media (max-width: 1200px) { .cq-file { display: none; } .cq-chat { border-radius: 12px; } .cq-study-head { align-items: flex-start; } .cq-study-controls { gap: 8px; justify-content: flex-end; } .cq-study-head > div:first-child { display: block; } }
@media (max-width: 740px) { .cq-study { padding: 12px 8px; } .cq-study-head { flex-direction: column; gap: 10px; } .cq-sidebar { display: none; } .cq-workbench-body { padding-left: 8px; } .cq-study-foot { flex-direction: column; gap: 4px; } .cq-workbench { height: 740px; } }
@media (hover: none) { .cq-now { opacity: 1; } }

/* Annotation study shares the opaque phrase/question material. */
.cq-note-study { position: absolute; z-index: 12; bottom: calc(100% + 8px); left: 20px; right: 20px; padding: 14px; border: 1px solid var(--cq-line); border-radius: 12px; background: var(--cq-input); color: var(--cq-text); }
.cq-note-study header, .cq-note-study footer { display: flex; align-items: center; gap: 8px; }
.cq-note-study header { justify-content: space-between; font-size: 13px; }
.cq-note-study blockquote { margin: 12px 0; padding: 0 0 0 10px; border-left: 2px solid var(--cq-line); color: var(--cq-secondary); font-size: 13px; line-height: 1.7; max-height: 100px; overflow: auto; overflow-wrap: anywhere; }
.cq-note-study textarea { display: block; width: 100%; min-height: 72px; padding: 10px; border: 1px solid var(--cq-line); border-radius: 8px; background: var(--cq-reading); color: var(--cq-text); font: inherit; font-size: 14px; resize: vertical; }
.cq-note-study textarea:focus { outline: 1px solid var(--cq-secondary); }
.cq-note-study footer { margin-top: 12px; flex-wrap: wrap; }
.cq-note-study footer span { flex: 1; }
.cq-note-study button { border: 0; border-radius: 7px; background: var(--cq-capsule); color: var(--cq-text); padding: 5px 9px; font-size: 12px; min-height: 28px; }
.cq-note-study header button { background: transparent; }
.cq-note-study .cq-note-save { background: var(--cq-text); color: var(--cq-input); }
.cq-note-study button:disabled { opacity: .4; }
.cq-annotation-chips { display: flex; align-items: center; gap: 2px; margin-bottom: 8px; width: fit-content; max-width: 100%; border-radius: 7px; background: var(--cq-capsule); }
.cq-annotation-chip { display: flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%; padding: 5px 8px; background: transparent; border: 0; color: var(--cq-text); font-size: 12px; }
.cq-annotation-chip span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.cq-annotation-chip svg { flex: none; }
