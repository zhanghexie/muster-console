<!doctype html><html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><title>ma-ui 试写预览</title>
<style>
/* ============================================================
   ma-ui 主题契约（深色 = base.css :root 原值；浅色 = 内置浅色主题原值）
   —— 全部颜色只经 var(--*) 引用；状态色淡底一律 color-mix 派生，不新增色源。
   ============================================================ */
:root {
  --bg-canvas: #141416;
  --bg-card: #262629;
  --bg-input: #161618;
  --hairline: #2a2a2d;
  --border-control: #363639;
  --ink: #ededee;
  --ink-soft: #d9d9dc;
  --text-2: #a3a3a8;
  --text-3: #98989d;
  --green: #45d0a0;
  --yellow: #e8c65a;
  --red: #f3687b;
  --blue: #6cc2ff;
  --purple: #a88fff;
  --action-bg: #8b7bff;
  --action-fg: #0f0f10;
  --action-hover: #998bfd;
  --hover-fill: rgba(255, 255, 255, 0.05);
  --hover-fill-strong: rgba(255, 255, 255, 0.09);
  --shadow-card: 0 0 0 1px rgba(255,255,255,0.06), 0 2px 6px rgba(0,0,0,0.35), 0 16px 40px rgba(0,0,0,0.28);
  --radius-small: 6px;
  --radius-control: 8px;
  --radius-card: 12px;
  --radius-pill: 999px;
  --fs-caption: 12px;
  --fs-ui: 13px;
  --fs-control: 14px;
  --fs-body: 15px;
  --fs-title: 17px;
  --fs-head: 20px;
  --font-sans: 'OPPO Sans', Geist, Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif;
  --font-mono: 'Cascadia Mono', 'Cascadia Code', Consolas, 'OPPO Sans', 'Courier New', monospace;
  --dur-micro: 120ms;
  --dur-menu: 160ms;
  --dur-panel: 280ms;
  --dur-exit: 200ms;
  --ease-standard: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-hover: ease-out;
}
:root[data-theme='light'] {
  --bg-canvas: #f7f7f5;
  --bg-card: #ffffff;
  --bg-input: #ffffff;
  --hairline: #e3e2dd;
  --border-control: #d6d5cf;
  --ink: #2f2e2b;
  --ink-soft: #45443f;
  --text-2: #55534f;
  --text-3: #64625d;
  --green: #18704f;
  --yellow: #795800;
  --red: #b52e47;
  --blue: #2464a4;
  --purple: #6843ba;
  --hover-fill: rgba(20, 18, 10, 0.045);
  --hover-fill-strong: rgba(20, 18, 10, 0.08);
  --shadow-card: 0 0 0 1px rgba(20,18,10,0.06), 0 1px 3px rgba(20,18,10,0.06), 0 12px 32px rgba(20,18,10,0.08);
}

/* ---------- 骨架类（宿主注入，agent 可直接用的结构类） ---------- */
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg-canvas);
  color: var(--ink);
  font: var(--fs-body)/1.65 var(--font-sans);
  -webkit-font-smoothing: antialiased;
}
.ma-card {
  background: var(--bg-card);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-card);
}
.ma-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px;
  font: 500 var(--fs-ui)/1.4 var(--font-sans);
  color: var(--ink-soft);
  background: transparent;
  border: 1px solid var(--border-control);
  border-radius: var(--radius-control);
  cursor: pointer;
  transition: background var(--dur-micro) var(--ease-hover), border-color var(--dur-micro) var(--ease-hover);
}
.ma-btn:hover { background: var(--hover-fill); }
.ma-btn--accent {
  color: var(--action-fg);
  background: var(--action-bg);
  border-color: transparent;
}
.ma-btn--accent:hover { background: var(--action-hover); }
.ma-chip {
  font: var(--fs-caption)/1 var(--font-mono);
  color: var(--text-3);
  background: var(--hover-fill);
  border: none;
  border-radius: var(--radius-small);
  padding: 3px 7px;
  cursor: pointer;
}
.ma-chip:hover { background: var(--hover-fill-strong); color: var(--text-2); }
.ma-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 1px 8px;
  border-radius: var(--radius-pill);
  font: 500 var(--fs-caption)/1.6 var(--font-sans);
}
.ma-badge[data-tone='success'] { color: var(--green); background: color-mix(in srgb, var(--green) 12%, transparent); }
.ma-badge[data-tone='danger']  { color: var(--red);   background: color-mix(in srgb, var(--red) 12%, transparent); }
.ma-badge[data-tone='warning'] { color: var(--yellow);background: color-mix(in srgb, var(--yellow) 14%, transparent); }
.ma-badge[data-tone='info']    { color: var(--blue);  background: color-mix(in srgb, var(--blue) 12%, transparent); }
.ma-badge[data-tone='neutral'] { color: var(--text-2);background: var(--hover-fill-strong); }
.mono { font-family: var(--font-mono); }

/* ---------- 演示页骨架（会话流 mock，非契约部分） ---------- */
.demo-top {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 12px;
  padding: 10px 20px;
  background: color-mix(in srgb, var(--bg-canvas) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--hairline);
}
.demo-top h1 { font: 600 var(--fs-title)/1.3 var(--font-sans); margin: 0; }
.demo-top .sub { color: var(--text-3); font-size: var(--fs-caption); }
.demo-top .spacer { flex: 1; }
.theme-seg {
  display: inline-flex; border: 1px solid var(--border-control); border-radius: var(--radius-pill); overflow: hidden;
}
.theme-seg button {
  border: none; background: transparent; color: var(--text-2);
  font: 500 var(--fs-caption)/1 var(--font-sans); padding: 7px 14px; cursor: pointer;
}
.theme-seg button.on { background: var(--hover-fill-strong); color: var(--ink); }
.chat-col { max-width: 780px; margin: 0 auto; padding: 24px 20px 140px; }
.day-sep {
  display: flex; align-items: center; gap: 12px; margin: 8px 0 20px;
  color: var(--text-3); font-size: var(--fs-caption);
}
.day-sep::before, .day-sep::after { content: ''; flex: 1; height: 1px; background: var(--hairline); }
.msg { margin: 18px 0; display: flex; gap: 10px; }
.msg .avatar {
  flex: none; width: 26px; height: 26px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-card); border: 1px solid var(--hairline);
  color: var(--text-2); font-size: 11px;
}
.msg .bubble { min-width: 0; }
.msg .who { font-size: var(--fs-caption); color: var(--text-3); margin-bottom: 3px; }
.msg .body { color: var(--ink-soft); white-space: pre-wrap; }
.msg.user { justify-content: flex-end; }
.msg.user .bubble { text-align: right; }
.msg.user .body {
  display: inline-block; text-align: left;
  background: var(--bg-card); border: 1px solid var(--hairline);
  border-radius: var(--radius-card); padding: 8px 14px; color: var(--ink);
}
.composer {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
  width: min(740px, calc(100vw - 40px));
  display: flex; gap: 8px; align-items: center;
  background: var(--bg-input);
  border: 1px solid var(--border-control);
  border-radius: var(--radius-card);
  padding: 8px 8px 8px 16px;
  box-shadow: var(--shadow-card);
  transition: border-color var(--dur-micro) var(--ease-hover);
}
.composer.flash { border-color: var(--action-bg); }
.composer input {
  flex: 1; border: none; outline: none; background: transparent;
  color: var(--ink); font: var(--fs-control)/1.5 var(--font-sans);
}
.composer input::placeholder { color: var(--text-3); }
.composer .send {
  border: none; border-radius: var(--radius-control);
  width: 34px; height: 34px; cursor: pointer;
  background: var(--action-bg); color: var(--action-fg);
  display: flex; align-items: center; justify-content: center;
}

/* ---------- 部件卡片（契约：宿主渲染的容器 chrome） ---------- */
.ma-widget {
  margin: 10px 0;
  opacity: 0; transform: translateY(10px);
  transition: opacity var(--dur-panel) var(--ease-standard), transform var(--dur-panel) var(--ease-standard);
}
.ma-widget.in { opacity: 1; transform: none; }
.ma-widget > .ma-shell { overflow: hidden; }
.ma-head {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 12px;
  border-bottom: 1px solid var(--hairline);
  background: color-mix(in srgb, var(--bg-card) 96%, var(--ink) 4%);
}
.ma-head .glyph { color: var(--text-2); display: flex; }
.ma-head .title { font: 500 var(--fs-ui)/1.4 var(--font-sans); color: var(--ink-soft); }
.ma-head .spacer { flex: 1; }
.ma-icon-btn {
  border: none; background: transparent; color: var(--text-3);
  width: 26px; height: 26px; border-radius: var(--radius-small);
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  transition: background var(--dur-micro) var(--ease-hover), color var(--dur-micro) var(--ease-hover);
}
.ma-icon-btn:hover { background: var(--hover-fill-strong); color: var(--ink); }
.ma-body { padding: 12px 14px; }

/* 链接卡（browser 模式在会话里的形态） */
.ma-linkcard {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 14px; cursor: pointer;
  transition: background var(--dur-micro) var(--ease-hover);
}
.ma-linkcard:hover { background: var(--hover-fill); }
.ma-linkcard .glyph {
  flex: none; width: 34px; height: 34px; border-radius: var(--radius-control);
  display: flex; align-items: center; justify-content: center;
  color: var(--purple); background: color-mix(in srgb, var(--purple) 12%, transparent);
}
.ma-linkcard .t1 { font: 500 var(--fs-ui)/1.4 var(--font-sans); color: var(--ink); }
.ma-linkcard .t2 { font: var(--fs-caption)/1.5 var(--font-mono); color: var(--text-3); }
.ma-linkcard .go { margin-left: auto; color: var(--text-3); }

/* ---------- table ---------- */
.ma-table { width: 100%; border-collapse: collapse; font-size: var(--fs-ui); }
.ma-table th {
  text-align: left; font-weight: 500; color: var(--text-3);
  font-size: var(--fs-caption); padding: 5px 10px 7px;
  border-bottom: 1px solid var(--hairline);
}
.ma-table td { padding: 6px 10px; border-bottom: 1px solid var(--hairline); color: var(--ink-soft); }
.ma-table tr:last-child td { border-bottom: none; }
.ma-table tbody tr { transition: background var(--dur-micro) var(--ease-hover); }
.ma-table tbody tr:hover { background: var(--hover-fill); }
.ma-table td.num, .ma-table th.num { text-align: right; font-family: var(--font-mono); }

/* ---------- kv ---------- */
.ma-kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; font-size: var(--fs-ui); }
.ma-kv .k { color: var(--text-3); }
.ma-kv .v { color: var(--ink-soft); text-align: right; }

/* ---------- stats ---------- */
.ma-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.ma-stat {
  border: 1px solid var(--hairline); border-radius: var(--radius-control);
  padding: 10px 12px;
  transition: background var(--dur-micro) var(--ease-hover);
}
.ma-stat:hover { background: var(--hover-fill); }
.ma-stat .label { font-size: var(--fs-caption); color: var(--text-3); }
.ma-stat .value { font: 600 var(--fs-head)/1.3 var(--font-sans); color: var(--ink); margin-top: 2px; }
.ma-stat .value .unit { font-size: var(--fs-caption); font-weight: 400; color: var(--text-3); margin-left: 3px; }
.ma-stat .trend { font-size: var(--fs-caption); margin-top: 2px; }
.ma-stat .trend.up { color: var(--green); }
.ma-stat .trend.down { color: var(--blue); }
.ma-stat .trend.warn { color: var(--red); }
.ma-stat .trend.flat { color: var(--text-2); }

/* ---------- compare ---------- */
.ma-compare { display: grid; gap: 2px; font-size: var(--fs-ui); }
.ma-compare .row { display: grid; grid-template-columns: 0.9fr 1.2fr 1.2fr; gap: 0; }
.ma-compare .cell { padding: 8px 10px; border-bottom: 1px solid var(--hairline); color: var(--ink-soft); }
.ma-compare .row:last-child .cell { border-bottom: none; }
.ma-compare .cell.crit { color: var(--text-3); font-size: var(--fs-caption); }
.ma-compare .cell.opt { position: relative; }
.ma-compare .cell.opt.rec {
  background: color-mix(in srgb, var(--action-bg) 6%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--action-bg) 40%, transparent);
}
.ma-compare .optname { font-weight: 500; color: var(--ink); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ma-compare .yes { color: var(--green); }
.ma-compare .no { color: var(--red); }
.ma-compare .tone-success { color: var(--green); }
.ma-compare .tone-danger { color: var(--red); }
.ma-compare .tone-warning { color: var(--yellow); }
.ma-compare .tone-info { color: var(--blue); }
.ma-compare .tone-neutral { color: var(--text-2); }
.ma-compare .verdict {
  margin-top: 10px; padding: 8px 12px; border-radius: var(--radius-control);
  background: color-mix(in srgb, var(--blue) 8%, transparent);
  color: var(--ink-soft); font-size: var(--fs-ui);
}

/* ---------- chart ---------- */
.ma-chart { display: flex; gap: 14px; align-items: center; }
.ma-chart svg { flex: 1; min-width: 0; }
.ma-chart .axis { fill: var(--text-3); font-size: 10px; font-family: var(--font-sans); }
.ma-chart .grid { stroke: var(--hairline); stroke-width: 1; }
.ma-chart { flex-wrap: wrap; }
.ma-chart .bar { fill: var(--blue); }
.ma-chart .bar.alt { fill: var(--purple); }
.ma-chart .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.ma-chart .dot { fill: var(--bg-card); stroke-width: 2; }
.ma-chart .line.s0, .ma-chart .dot.s0 { stroke: var(--blue); }
.ma-chart .line.s1, .ma-chart .dot.s1 { stroke: var(--purple); }
.ma-chart .line.s2, .ma-chart .dot.s2 { stroke: var(--green); }
.ma-chart .line.s3, .ma-chart .dot.s3 { stroke: var(--yellow); }
.ma-chart .line.s4, .ma-chart .dot.s4 { stroke: var(--red); }
.ma-chart .bar.s1 { fill: var(--purple); }
.ma-chart .bar.s2 { fill: var(--green); }
.ma-chart .bar.s3 { fill: var(--yellow); }
.ma-chart .bar.s4 { fill: var(--red); }
.ma-series-legend { width: 100%; display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; font-size: var(--fs-caption); color: var(--text-2); }
.ma-series-legend .li { display: inline-flex; align-items: center; gap: 6px; }
.ma-series-legend .dotc { width: 8px; height: 8px; border-radius: 50%; }
.ma-series-legend .dotc.s0 { background: var(--blue); }
.ma-series-legend .dotc.s1 { background: var(--purple); }
.ma-series-legend .dotc.s2 { background: var(--green); }
.ma-series-legend .dotc.s3 { background: var(--yellow); }
.ma-series-legend .dotc.s4 { background: var(--red); }
.ma-chart .val { fill: var(--text-2); font-size: 10px; font-family: var(--font-mono); }
.ma-legend { display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-caption); color: var(--text-2); min-width: 108px; }
.ma-legend .li { display: flex; align-items: center; gap: 7px; }
.ma-legend .dotc { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.ma-legend .pct { margin-left: auto; color: var(--text-3); font-family: var(--font-mono); }

/* ---------- steps ---------- */
.ma-steps { list-style: none; margin: 0; padding: 0; }
.ma-steps li { position: relative; display: flex; gap: 12px; padding: 0 0 18px 0; }
.ma-steps li::before {
  content: ''; position: absolute; left: 5.5px; top: 16px; bottom: 0; width: 1px;
  background: var(--hairline);
}
.ma-steps li:last-child { padding-bottom: 2px; }
.ma-steps li:last-child::before { display: none; }
.ma-steps .dot {
  flex: none; width: 12px; height: 12px; margin-top: 4px; border-radius: 50%;
  border: 2px solid var(--border-control); background: var(--bg-card);
}
.ma-steps li[data-state='done'] .dot { border-color: var(--green); background: var(--green); }
.ma-steps li[data-state='doing'] .dot { border-color: var(--blue); }
.ma-steps li[data-state='doing'] .dot::after {
  content: ''; display: block; width: 4px; height: 4px; margin: 2px; border-radius: 50%;
  background: var(--blue); animation: ma-pulse var(--dur-breath, 1800ms) var(--ease-loop, ease-in-out) infinite;
}
@keyframes ma-pulse { 50% { opacity: 0.25; } }
.ma-steps .t { font: 500 var(--fs-ui)/1.5 var(--font-sans); color: var(--ink); }
.ma-steps li[data-state='todo'] .t { color: var(--text-2); font-weight: 400; }
.ma-steps .d { font-size: var(--fs-caption); color: var(--text-3); }
.ma-steps .side { margin-left: auto; flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.ma-steps .side .date { font: var(--fs-caption)/1.4 var(--font-mono); color: var(--text-3); }
.ma-steps .note, .ma-checklist .note { font-size: var(--fs-caption); color: var(--text-3); white-space: pre-line; }
.ma-note { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--hairline); color: var(--text-3); font-size: var(--fs-caption); white-space: pre-line; }
.ma-checklist .txtwrap { display: flex; flex-direction: column; min-width: 0; }
.kv-sec-title { font: 500 var(--fs-caption)/2 var(--font-sans); color: var(--text-3); margin: 10px 0 2px; }
.kv-sec-title:first-child { margin-top: 0; }

/* ---------- checklist ---------- */
.ma-checklist { display: flex; flex-direction: column; gap: 2px; font-size: var(--fs-ui); }
.ma-checklist .item {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px; border-radius: var(--radius-control);
  transition: background var(--dur-micro) var(--ease-hover);
}
.ma-checklist .item:hover { background: var(--hover-fill); }
.ma-checklist .mark { flex: none; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--border-control); }
.ma-checklist .item[data-state='done'] .mark { border-color: var(--green); background: var(--green); }
.ma-checklist .item[data-state='doing'] .mark { border-color: var(--blue); }
.ma-checklist .item[data-state='blocked'] .mark { border-color: var(--yellow); }
.ma-checklist .txt { color: var(--ink-soft); }
.ma-checklist .item[data-state='done'] .txt { color: var(--text-3); text-decoration: line-through; text-decoration-color: var(--text-3); }
.ma-checklist .side { margin-left: auto; flex: none; }
.ma-checklist .item { cursor: pointer; }
.ma-table th.sortable { cursor: pointer; user-select: none; }
.ma-table th.sortable:hover { color: var(--text-2); }

/* ---------- group ---------- */
.ma-group { display: grid; gap: 10px; }
.ma-group[data-cols='2'] { grid-template-columns: repeat(2, 1fr); }
.ma-group[data-cols='3'] { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 560px) {
  .ma-group[data-cols='2'], .ma-group[data-cols='3'] { grid-template-columns: 1fr; }
}
.ma-group-item { min-width: 0; border: 1px solid var(--hairline); border-radius: var(--radius-control); background: var(--bg-card); }
.ma-group-item[data-span='full'] { grid-column: 1 / -1; }
.ma-group-item .item-title {
  padding: 8px 12px 0; font: 500 var(--fs-caption)/1.5 var(--font-sans); color: var(--text-3);
}
.ma-group-item .ma-body { padding: 8px 12px 12px; }

/* ---------- controls ---------- */
.ma-controls .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.ma-controls .field label { display: block; font-size: var(--fs-caption); color: var(--text-3); margin-bottom: 6px; }
.ma-controls .field .cur { color: var(--ink); font-family: var(--font-mono); }
.ma-controls input[type='range'] { width: 100%; accent-color: var(--action-bg); }
.ma-controls input[type='number'] {
  width: 100%; padding: 6px 10px; outline: none;
  background: var(--bg-input); color: var(--ink);
  border: 1px solid var(--border-control); border-radius: var(--radius-control);
  font: var(--fs-ui)/1.4 var(--font-mono);
}
.ma-controls .outs { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 14px; }
.ma-controls .out {
  border: 1px solid var(--hairline); border-radius: var(--radius-control); padding: 8px 12px;
}
.ma-controls .out .label { font-size: var(--fs-caption); color: var(--text-3); }
.ma-controls .out .value { font: 600 var(--fs-title)/1.4 var(--font-mono); color: var(--ink); }
.ma-controls .out .value .unit { font-size: var(--fs-caption); font-weight: 400; color: var(--text-3); margin-left: 3px; font-family: var(--font-sans); }
.ma-controls .actions { margin-top: 14px; display: flex; gap: 8px; }

/* 弹出预览（browser 模式独立窗口形态） */
body.pop { display: grid; place-items: center; min-height: 100vh; }
body.pop .ma-widget { margin: 20px; opacity: 1; transform: none; width: min(720px, 92vw); }

.preview-head{max-width:780px;margin:24px auto 0;padding:0 20px;color:var(--text-3);font-size:var(--fs-caption)}
.preview-list{max-width:780px;margin:0 auto;padding:12px 20px 80px}
</style></head><body>

  /* ---------- 迷你表达式求值器（controls 用；只允许算术/比较/白名单函数，不 eval） ---------- */
  function evalExpr(src, scope) {
    var toks = [];
    var s = String(src).replace(/\s+/g, '');
    for (var i = 0; i < s.length;) {
      var ch = s[i];
      if (/[0-9.]/.test(ch)) {
        var num = '';
        while (i < s.length && /[0-9.]/.test(s[i])) num += s[i++];
        toks.push({ t: 'num', v: parseFloat(num) });
      } else if (/[a-zA-Z_]/.test(ch)) {
        var id = '';
        while (i < s.length && /[a-zA-Z_0-9]/.test(s[i])) id += s[i++];
        toks.push({ t: 'id', v: id });
      } else if ('+-*/(),<>='.includes(ch)) {
        if ((ch === '>' || ch === '<' || ch === '=') && s[i + 1] === '=') { toks.push({ t: 'op', v: ch + '=' }); i += 2; }
        else { toks.push({ t: 'op', v: ch }); i++; }
      } else throw new Error('ma-ui: 表达式含非法字符 ' + ch);
    }
    var p = 0;
    function peek() { return toks[p]; }
    function eat(v) {
      var t = toks[p++];
      if (!t || t.v !== v) throw new Error('ma-ui: 表达式语法错误（期望 ' + v + '）');
      return t;
    }
    var FN = {
      round: function (x, n) { var m = Math.pow(10, n || 0); return Math.round(x * m) / m; },
      min: Math.min, max: Math.max, abs: Math.abs,
      sum: function () { return [].reduce.call(arguments, function (a, b) { return a + b; }, 0); }
    };
    function primary() {
      var t = peek();
      if (!t) throw new Error('ma-ui: 表达式意外结束');
      if (t.t === 'num') { p++; return t.v; }
      if (t.t === 'id') {
        p++;
        if (peek() && peek().v === '(') {
          eat('(');
          var args = [expr()];
          while (peek() && peek().v === ',') { eat(','); args.push(expr()); }
          eat(')');
          var fn = FN[t.v];
          if (!fn) throw new Error('ma-ui: 未知函数 ' + t.v);
          return fn.apply(null, args);
        }
        if (!(t.v in scope)) throw new Error('ma-ui: 未知变量 ' + t.v);
        return scope[t.v];
      }
      if (t.v === '(') { eat('('); var v = expr(); eat(')'); return v; }
      if (t.v === '-') { p++; return -primary(); }
      throw new Error('ma-ui: 表达式语法错误（' + t.v + '）');
    }
    function mul() { var v = primary(); while (peek() && (peek().v === '*' || peek().v === '/')) { var o = toks[p++].v; v = o === '*' ? v * primary() : v / primary(); } return v; }
    function add() { var v = mul(); while (peek() && (peek().v === '+' || peek().v === '-')) { var o = toks[p++].v; v = o === '+' ? v + mul() : v - mul(); } return v; }
    function cmp() { var v = add(); while (peek() && ['<', '>', '<=', '>='].includes(peek().v)) { var o = toks[p++].v; var r = add(); v = o === '<' ? v < r : o === '>' ? v > r : o === '<=' ? v <= r : v >= r; } return v; }
    function expr() { return cmp(); }
    var out = expr();
    if (p < toks.length) throw new Error('ma-ui: 表达式有未消费尾部');
    return out;
  }

  /* ---------- 部件挂载 ---------- */
  function mountWidget(fig) {

      var lc = el('div', 'ma-linkcard');
      lc.innerHTML =

        '<span><span class="t1">' + esc(data.title || preset) + '</span><br><span class="t2">' + esc(fig.dataset.file || '') + '</span></span>' +
        '<span class="go"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 3.5h6.5V10M12.5 3.5L7 9M11 12.5H3.5V5"/></svg></span>';
      lc.addEventListener('click', function () { openStandalone(fig); });
      shell.appendChild(lc);
    } else {
      var head = el('div', 'ma-head');
      head.innerHTML =
        '<span class="glyph">' + svgIcon(preset) + '</span>' +
        '<span class="title">' + esc(data.title || preset) + '</span>' +
        '<span class="spacer"></span>';
      var fileChip = el('button', 'ma-chip', esc(fig.dataset.file || ''));
      fileChip.title = '复制路径（演示）';
      fileChip.addEventListener('click', function () {
        if (navigator.clipboard) navigator.clipboard.writeText(fig.dataset.file || '').catch(function () {});
        var old = fileChip.textContent;
        fileChip.textContent = '已复制';
        setTimeout(function () { fileChip.textContent = old; }, 1200);
      });
      head.appendChild(fileChip);
      var openBtn = el('button', 'ma-icon-btn');
      openBtn.title = '在网页区打开';
      openBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 3.5h6.5V10M12.5 3.5L7 9M11 12.5H3.5V5"/></svg>';

  /* browser 模式 / 「在网页区打开」：弹出独立渲染视图（右侧网页区的形态预览） */
  function openStandalone(fig) {
    var css = document.getElementById('ma-contract-style').textContent;
    var js = document.getElementById('ma-runtime').textContent;
    var html = '<!doctype html><html lang="zh-CN" data-theme="' + document.documentElement.dataset.theme + '"><head><meta charset="utf-8"><title>' +
      esc(fig.dataset.file || 'ma-ui') + '</title><style>' + css + '</style></head>' +
      '<body class="pop">' + fig.outerHTML + '<script>' + js + '<\/script>' +
      '<script>maUi.mountAll()<\/script></body></html>';
    var url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
    window.open(url);
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  }

  /* ---------- 演示页交互（非契约） ---------- */
  var maUi = {
    mountAll: function () {
      document.querySelectorAll('.ma-widget').forEach(mountWidget);
      if (!document.body.classList.contains('pop')) {
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (en) {
            if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
          });
        }, { threshold: 0.15 });
        document.querySelectorAll('.ma-widget:not(.in)').forEach(function (f) { io.observe(f); });
      }
    },
    followup: function (text) {
      var composer = document.getElementById('composer');
      var input = document.getElementById('composerInput');
      if (!composer || !input) return;
      input.value = text;
      composer.classList.add('flash');
      setTimeout(function () { composer.classList.remove('flash'); }, 900);
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    }
  };
  window.maUi = maUi;
  maUi.mountAll();

  document.querySelectorAll('.theme-seg button').forEach(function (b) {
    b.addEventListener('click', function () {
      document.documentElement.dataset.theme = b.dataset.set;
      document.querySelectorAll('.theme-seg button').forEach(function (x) { x.classList.toggle('on', x === b); });
    });
  });
})();
</script>
