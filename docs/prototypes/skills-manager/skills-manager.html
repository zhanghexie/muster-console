  <style>
:root {
  color-scheme: dark;

  /* ===== 框与页（Frame & Sheet，design.md §1.1）：框 = 导航底色，页 = 连续阅读面 ===== */
  --frame-gap: 8px; /* 工作面外缘与侧栏列表共用的最终可见留白，避免内外层叠加。 */
  --bg-frame: #202023; /* F 框：顶栏/左栏共用稍亮的导航底色，可混入工作区色形成纯色 */
  --bg-canvas: #141416; /* L0 页内凹陷内容面：终端/编辑器/看板列井 */
  --bg-panel: #141416; /* L1 页：聊天/文件等阅读面加深，与终端/编辑器连续 */
  --bg-raised: #232326; /* L2 页内浮起物：卡片/工具条/代码块/气泡 */
  --bg-overlay: #262629; /* L3 脱离文档流浮层：菜单/popover/弹窗 */
  --bg-input: #161618; /* 输入控件：以轻微明度差与描边区分阅读面 */

  --ink: #ededee;
  --ink-soft: #d9d9dc;
  --text-2: #a3a3a8; /* 二级文字：说明/次要操作/图标默认色 */
  --text-3: #98989d; /* 三级文字仍需可读：占位/辅助 meta/分组标题 */
  /* 超椭圆 1px 实线会放像素锯齿：描边压暗、低对比，聚焦不提亮边 */
  --hairline: #2a2a2d;

  /* ===== 状态色（语义专用，不做装饰，design.md §1.3；薄荷绿系：浅、冷）===== */
  --green: #45d0a0;
  --yellow: #e8c65a;
  --red: #f3687b;
  --blue: #6cc2ff;
  --purple: #a88fff;

  /* ===== 工作区强调色（外观设置里的全局默认/工作区覆盖，workspaceAccent(id) 查表，App 写到 :root 内联）===== */
  --ws-accent: #8b7bff;
  --on-accent: #0f0f10;

  /* ===== 语法高亮（内容色，仅限代码/markdown 内容，design.md §1.4）===== */
  --syn-fg: #c9d1d9;
  --syn-muted: #8b949e;
  --syn-blue: #8ac6ff;
  --syn-cyan: #a5d8ff;
  --syn-red: #f88b9a;
  --syn-purple: #c3b1ff;
  --syn-orange: #ffb37d;
  --syn-yellow: #e8d47c;

  /* ===== 交互叠白（design.md §8：不换海拔不换色相）===== */
  --hover-fill: rgba(255, 255, 255, 0.05);
  --hover-fill-strong: rgba(255, 255, 255, 0.09);
  --selected-fill: rgba(255, 255, 255, 0.08);
  --selection-surface: color-mix(in srgb, var(--ink) 15%, transparent); /* 随明暗主题反向的中性选中叠层 */
  --bg-inset: rgba(127, 127, 127, 0.08); /* 凹陷/内嵌底（中性灰，不随色彩主题变） */

  /* 设置页阴影：1px 亮环 + 近层；主工作面与左栏不再挂独立页阴影。 */
  --shadow-page: 0 0 0 1px rgba(255, 255, 255, 0.06), 0 2px 6px rgba(0, 0, 0, 0.35);
  /* 卡片浮起：1px 亮环 + 近/远两层投影 */
  --shadow-card: 0 0 0 1px rgba(255, 255, 255, 0.06), 0 2px 6px rgba(0, 0, 0, 0.35), 0 16px 40px rgba(0, 0, 0, 0.28);
  --shadow-pop: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 20px 56px rgba(0, 0, 0, 0.6);
  /* 输入区采用纯色哑光面；保留旧主题键，默认取消光泽和投影。 */
  --shadow-input: none;

  /* 兼容旧组件的材质 token：统一为不透明实底，无背景模糊。 */
  --glass-sheet: var(--bg-panel);
  --glass-float: var(--bg-panel);
  --glass-blur: none;
  --input-surface: var(--bg-raised);
  --input-border: color-mix(in srgb, var(--ink) 6%, var(--hairline));
  --composer-chip: color-mix(in srgb, var(--ink) 5%, var(--input-surface));
  --composer-chip-hover: color-mix(in srgb, var(--ink) 9%, var(--input-surface));
  --skel-a: rgba(255, 255, 255, 0.04);
  --skel-b: rgba(255, 255, 255, 0.09);
  --scroll-thumb: #3a3a3e;
  --scroll-thumb-hover: #4c4c52;

  /* ===== 旧名兼容层（只映射，不新造值）===== */
  --canvas: var(--bg-canvas);
  --paper: var(--bg-raised);
  --surface-alt: var(--bg-panel);
  --bg: var(--bg-canvas);
  --bg-elevated: var(--bg-raised);
  --border: var(--hairline);
  --text: var(--ink);
  --text-dim: var(--text-2);
  --text-muted: var(--text-3); /* 修歧义：muted 比 dim 更弱一档 */
  --mid: var(--text-2); /* 旧名：二级文字/描边灰（修复历史悬空引用） */
  --accent: var(--ink);
  --accent-soft: var(--selected-fill);

  /* ===== 圆角：控件 8 / 卡与页 12 / 弹窗 16 / 胶囊（框与页：页与卡同档）===== */
  --radius-control: 8px;
  --radius-card: 12px;
  --radius-modal: 16px;
  --radius-pill: 999px;
  --radius-small: 6px;
  /* k→1 更圆、直边更短；k 越大越方。1.5 曲率连续，比 squircle(2)/4 圆 */
  --corner-shape: superellipse(1.5);

  /* type scale（字阶之外的字号一律不许新增）
   * 2026-09-21 整体上移 1px（OPPO Sans 字面偏秀气，原档偏小）+ 新增阅读标题档；
   * 密度由行高/间距控制，不靠压字号——见 design.md §5 */
  --font-micro: 10px;
  --font-caption: 12px;
  --font-ui: 13px;
  --font-control: 14px;
  --font-body: 15px;
  --font-title: 17px;
  /* 阅读标题档：仅 markdown 内容域 h1（.md-body h1）使用 */
  --font-head: 20px;

  /* 等宽栈：西文/数字走 Cascadia→Consolas（等宽不变）；三者均无中文字形，
   * 中文落到 OPPO Sans（2026-09-21：原为系统雅黑，编辑器/代码块里的中文与 UI 字体不统一） */
  --font-mono: 'Cascadia Mono', 'Cascadia Code', Consolas, 'OPPO Sans', 'Courier New', monospace;
  /* 比例栈（UI 正文/文档感编辑共用）：OPPO Sans 首选，离线/未加载回退后续 */
  --font-sans: 'OPPO Sans', Geist, Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif;

  /* 遮罩/禁用统一刻度 */
  --scrim: rgba(0, 0, 0, 0.45);
  --disabled-opacity: 0.45;

  /* 浮层层级（流内 1-5 不在此列；同档内用 calc(+1) 表达先后） */
  --z-sticky: 10;
  --z-overlay: 20;
  --z-dropdown: 40;
  --z-popover: 60;
  --z-modal: 100;
  --z-menu: 200;
  --z-tooltip: 250; /* tooltip 浮在菜单之上、确认框之下 */
  --z-confirm: 300;

  /* 焦点：1px 细描边，比 hairline 略亮、远暗于 --text-2，表面颜色不动 */
  --focus-border: color-mix(in srgb, var(--ink) 22%, var(--hairline));
  --focus-ring: none;

  /* ===== 动画 token（docs/audits/animation-system-research.md）：全应用唯一曲线/时长来源 =====
   * 入场签名（快起缓收，easeOutExpo 型）；退场统一更快；动画属性只许 transform/opacity/grid-template-rows。 */
  --ease-standard: cubic-bezier(0.16, 1, 0.3, 1); /* 入场：起步快、结尾长缓停 */
  --ease-exit: cubic-bezier(0.4, 0, 0.2, 1); /* 退场：缓起快收 */
  --ease-hover: ease-out; /* 微交互（hover/图标） */
  --ease-move: cubic-bezier(0.33, 0.1, 0.25, 1); /* 大位移（虚拟屏条带/工作区胶片） */
  --ease-loop: cubic-bezier(0.37, 0, 0.63, 1); /* 循环装饰（呼吸/轻浮；对称缓入缓出） */
  --dur-micro: 120ms; /* hover/图标旋转 */
  --dur-menu: 160ms; /* 菜单/小浮层 */
  --dur-panel: 280ms; /* 面板/弹窗入场 */
  --dur-exit: 200ms; /* 退场统一更快（菜单退场用 --dur-micro）；JS 侧 motion.tsx MOTION 须同步（test/motion-token-sync.mjs 守） */
  --dur-move: 420ms; /* 大位移（虚拟屏/工作区胶片/全局看板整屏下拉） */
  --dur-stagger: 30ms; /* 级联步长（逐层/逐项延迟） */
  --dur-loop: 900ms; /* 循环装饰：旋转/闪烁类（spinner、光标）；不参与 presence，motion.tsx loopMs 仅作对齐登记 */
  --dur-breath: 1800ms; /* 循环装饰：呼吸/起伏类（=2×loop；需要你、打字点、脉冲、shimmer；更大面积取其倍数） */
  --spinner-stroke: 1.4; /* 运行态 spinner 线宽（与 icons 细线家族对齐） */
  --spinner-dash: 75 25; /* pathLength=100；75% 弧 + 25% 缺口 = 90° */
}
    *, *::before, *::after { box-sizing: border-box; corner-shape: var(--corner-shape); }
    html, body { margin: 0; min-height: 100%; }
    body { background: var(--bg-frame); color: var(--text); font-family: var(--font-sans); font-size: var(--font-ui); }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 1px solid var(--focus-border); outline-offset: 2px; }
    :root[data-theme='light'] { --input-surface: var(--bg-input); }
/* 弹窗/大面板：淡入 + 轻微上浮入场；退场反向更快 */
.mp-panel {
  transition:
    opacity var(--dur-panel) var(--ease-standard),
    transform var(--dur-panel) var(--ease-standard);
}

.mp-panel[data-mp-stage='enter'] {
  opacity: 0;
  transform: translateY(8px) scale(0.985);
  transition: none; /* 起始态：usePresence 在 layout 阶段落成计算样式后切 in 起播 */
}

.mp-panel[data-mp-stage='in'] {
  opacity: 1;
  transform: none;
}

.mp-panel[data-mp-stage='out'] {
  opacity: 0;
  transform: translateY(6px) scale(0.992);
  transition-duration: var(--dur-exit), var(--dur-exit);
  transition-timing-function: var(--ease-exit), var(--ease-exit);
  pointer-events: none; /* 退场层不可交互：既避免误点，也免去调用方闭包悬空 */
}

/* 顶部对齐浮层（命令面板等）：入场方向改为自上而下 */
.mp-panel-top[data-mp-stage='enter'] {
  transform: translateY(-8px) scale(0.99);
}

.mp-panel-top[data-mp-stage='out'] {
  transform: translateY(-6px) scale(0.995);
}

/* 菜单/小浮层：更快一档，位移更小（默认万向：scale+opacity，不带轴向位移） */
.mp-pop {
  transition:
    opacity var(--dur-menu) var(--ease-standard),
    transform var(--dur-menu) var(--ease-standard);
}

.mp-pop[data-mp-stage='enter'] {
  opacity: 0;
  transform: scale(0.98);
  transition: none;
}

.mp-pop[data-mp-stage='in'] {
  opacity: 1;
  transform: none;
}

.mp-pop[data-mp-stage='out'] {
  opacity: 0;
  transform: scale(0.985);
  transition-duration: var(--dur-micro), var(--dur-micro);
  transition-timing-function: var(--ease-exit), var(--ease-exit);
  pointer-events: none;
}

/* 向上弹出的菜单（composer 菜单等）：自下而上 4px 入场 */
.mp-pop-up[data-mp-stage='enter'] {
  transform: translateY(4px) scale(0.98);
}

.mp-pop-up[data-mp-stage='out'] {
  transform: translateY(2px) scale(0.985);
}

/* 全屏 scrim 遮罩：只动 opacity */
.mp-scrim {
  transition: opacity var(--dur-panel) var(--ease-standard);
}

.mp-scrim[data-mp-stage='enter'] {
  opacity: 0;
  transition: none;
}

.mp-scrim[data-mp-stage='in'] {
  opacity: 1;
}

.mp-scrim[data-mp-stage='out'] {
  opacity: 0;
  transition-duration: var(--dur-exit);
  transition-timing-function: var(--ease-exit);
  pointer-events: none;
}

/* 视图切换「先出后入」：常驻视图叠放互切（父容器挂 .xfade-stack 需 position:relative）。
 * 旧视图 --dur-micro 快速淡出，新视图等旧视图淡出过半再淡入——两屏文字不在同一时刻
 * 以可辨认的透明度叠印（同时交叉淡化会叠字）。叠放宿主底色须与所在页一致，否则
 * 两层之间的空档会闪出另一种底色。
 * visibility 延迟到 opacity 结束后切换：隐藏期不可交互/不可聚焦，切换期可过渡。 */
.xfade-stack {
  position: relative;
  flex: 1;
  min-height: 0;
  min-width: 0;
}

.xfade {
  position: absolute;
  inset: 0;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition:
    opacity var(--dur-micro) var(--ease-exit),
    visibility 0s linear var(--dur-micro);
}

.xfade.is-shown {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transition:
    opacity var(--dur-panel) var(--ease-standard) calc(var(--dur-micro) / 2),
    visibility 0s;
}

/* 高频切换（会话实例）瞬切：保留叠放保活结构，只去掉过渡 */
.xfade.xfade-instant,
.xfade.xfade-instant.is-shown {
  transition: none;
}

/* 嵌套不变量：外层 xfade 隐藏时，内层 is-shown 不得把可见/可命中写回去。
 * visibility 与 pointer-events 都能被后代显式覆盖——不补这条，隐藏页里
 * 常驻叠放（如未激活 Git 页的 .git-detail-pane.is-shown）会变成「看不见
 * 但吃掉点击/滚轮」的透明层。退场沿用延后 visibility 的时序，不破坏外层淡出 */
.xfade:not(.is-shown) .xfade.is-shown {
  visibility: hidden;
  pointer-events: none;
  transition:
    opacity var(--dur-micro) var(--ease-exit),
    visibility 0s linear var(--dur-micro);
}

/* 手风琴/折叠体：grid 行高过渡（内容保活、纯 transition 可打断）。
 * 用法：外壳 .acc（display:grid; grid-template-rows:0fr↔1fr）+ 内容 .acc-body（overflow:hidden; min-height:0） */
.acc {
  display: grid;
  transition:
    grid-template-rows var(--dur-panel) var(--ease-standard),
    opacity var(--dur-panel) var(--ease-standard);
}

.acc.is-open {
  grid-template-rows: 1fr;
}

/* 收起走退场档（更快、缓起快收） */
.acc:not(.is-open) {
  grid-template-rows: 0fr;
  opacity: 0;
  transition-duration: var(--dur-exit), var(--dur-exit);
  transition-timing-function: var(--ease-exit), var(--ease-exit);
}

.acc-body {
  overflow: hidden;
  min-height: 0;
}

/* 减弱动态：全部进出场退化为瞬时（token 换值一处生效，循环装饰类另行按需登记） */
@media (prefers-reduced-motion: reduce) {
  .mp-panel,
  .mp-pop,
  .mp-scrim,
  .xfade,
  .acc,
  .agent-float-panel,
  .agent-ws-stack-row,
  .agent-ws-stack-rest {
    transition: none !important;
  }

  .mp-panel[data-mp-stage='enter'],
  .mp-pop[data-mp-stage='enter'],
  .mp-scrim[data-mp-stage='enter'],
  .agent-float-panel.is-entering {
    opacity: 1;
    transform: none;
  }

  /* 全局兜底：循环装饰（spinner/shimmer/呼吸/跑马灯等）一并静止 */
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    transition-delay: 0s !important;
  }
}

.sm-text-button { display: inline-flex; align-items: center; gap: 4px; border: 0; background: transparent; padding: 0; font-size: var(--font-caption); color: var(--text-2); white-space: nowrap; }
.sm-text-button:hover { color: var(--text); }
.sm-demo-wrap { position: relative; flex-shrink: 0; }
.sm-demo-menu { position: absolute; top: calc(100% + 8px); right: 0; z-index: 8; width: 256px; padding: 12px; background: var(--bg-overlay); border-radius: var(--radius-card); box-shadow: var(--shadow-pop); }
.sm-demo-menu > span { display: block; padding: 4px 8px 8px; }
.sm-demo-menu > button { display: block; width: 100%; border: 0; background: transparent; text-align: left; padding: 10px 8px; border-radius: var(--radius-control); }
.sm-demo-menu > button:hover { background: var(--hover-fill); }
.sm-demo-menu small { display: block; margin-top: 4px; color: var(--text-2); font-size: var(--font-caption); }
.sm-scope-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 28px 0 24px; }
.sm-scope-switch { display: flex; gap: 4px; padding: 4px; background: var(--bg-raised); border-radius: var(--radius-control); }
.sm-scope-switch button { display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 6px 12px; border: 0; border-radius: var(--radius-small); background: transparent; color: var(--text-2); }
.sm-scope-switch button[aria-pressed=true] { background: var(--selected-fill); color: var(--text); }
.sm-scope-hint { margin-left: auto; color: var(--text-3); font-size: var(--font-caption); }
.sm-prototype select { min-width: 0; min-height: 36px; border: 1px solid var(--hairline); border-radius: var(--radius-control); background: var(--bg-input); padding: 6px 28px 6px 12px; color: var(--text-2); }
.sm-prototype option { background: var(--bg-overlay); color: var(--text); }
.sm-manager-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 32px; flex: 1; min-height: 500px; position: relative; align-items: start; }
.sm-inventory { min-width: 0; }
.sm-list-tools { display: flex; gap: 12px; padding-bottom: 12px; }
.sm-list-tools > select { width: 132px; }
.sm-search { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; min-height: 38px; background: var(--bg-input); border: 1px solid var(--hairline); border-radius: var(--radius-control); padding: 0 12px; color: var(--text-3); }
.sm-search input { min-width: 0; width: 100%; background: transparent; border: 0; outline: 0 !important; padding: 8px 0; }
.sm-search:focus-within { outline: 1px solid var(--focus-border); }
.sm-search input::placeholder { color: var(--text-3); }
.sm-search button { display: flex; padding: 2px; border: 0; background: transparent; color: var(--text-2); }
.sm-list-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 16px 0 8px; padding: 0 8px; color: var(--text-3); font-size: var(--font-caption); }
.sm-list-heading > span:last-child { font-size: var(--font-caption); }
.sm-list-heading small { margin-left: 8px; font-size: inherit; }
.sm-asset-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: transparent; border: 0; border-radius: var(--radius-control); padding: 16px 12px; margin: 4px 0; }
.sm-asset-row:hover { background: var(--hover-fill); }
.sm-asset-row.is-selected { background: var(--selected-fill); }
.sm-row-icon, .sm-asset-icon { display: grid; place-items: center; background: var(--bg-raised); color: var(--text-2); border-radius: var(--radius-control); flex-shrink: 0; }
.sm-row-icon { width: 36px; height: 40px; }
.sm-row-content { display: flex; flex-direction: column; min-width: 0; flex: 1; gap: 3px; }
.sm-row-name { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: var(--font-control); font-weight: 500; }
.sm-row-description { display: block; color: var(--text-2); font-size: var(--font-caption); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sm-row-meta { color: var(--text-3); font-size: var(--font-caption); }
.sm-row-targets { display: flex; gap: 4px; flex-shrink: 0; }
.sm-target-mark { display: inline-grid; place-items: center; width: 24px; height: 24px; font-size: var(--font-caption); font-weight: 500; background: var(--bg-raised); border: 1px solid var(--hairline); border-radius: var(--radius-small); color: var(--text-2); }
.sm-row-targets > .sm-target-mark + .sm-target-mark { margin-left: -4px; }
.sm-asset-row > svg { color: var(--text-3); }
.sm-no-target { font-size: var(--font-caption); color: var(--text-3); }
.sm-badge { display: inline-flex; padding: 1px 6px; border-radius: var(--radius-small); background: var(--bg-inset); color: var(--text-2); font-size: var(--font-caption); font-weight: 400; }
.sm-badge.is-warn { color: var(--yellow); background: color-mix(in srgb, var(--yellow) 9%, transparent); }
.sm-badge.is-ok { color: var(--green); background: color-mix(in srgb, var(--green) 9%, transparent); }
.sm-list-bottom { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 28px 8px 24px; color: var(--text-3); font-size: var(--font-caption); }
.sm-list-bottom > span:last-child { margin-left: auto; }
.sm-detail { min-width: 0; padding: 0 0 24px 24px; transform-origin: right top; }
.sm-detail-head { display: flex; align-items: center; justify-content: space-between; margin-top: -4px; margin-bottom: 20px; }
.sm-detail-title { display: flex; align-items: center; gap: 12px; }
.sm-asset-icon { width: 44px; height: 48px; }
.sm-detail-title h2 { font-size: var(--font-title); font-weight: 500; letter-spacing: -.2px; overflow-wrap: anywhere; }
.sm-detail-description { color: var(--text-2); margin-top: 12px !important; }
.sm-scope-note { display: flex; align-items: flex-start; gap: 8px; padding: 12px 0; margin-top: 12px; }
.sm-scope-note > svg { margin-top: 3px; color: var(--text-2); }
.sm-scope-note strong { font-weight: 500; font-size: var(--font-caption); }
.sm-scope-note span { display: block; font-size: var(--font-caption); color: var(--text-3); margin-top: 3px; }
.sm-scope-note.is-inherited { background: var(--bg-raised); padding: 12px; border-radius: var(--radius-control); flex-wrap: wrap; }
.sm-scope-note.is-inherited > .sm-text-button { margin-left: 24px; margin-top: 4px; }
.sm-detail-section { margin-top: 24px; }
.sm-section-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
.sm-section-head h3 { font-size: var(--font-ui); font-weight: 500; }
.sm-section-head > span { color: var(--text-3); font-size: var(--font-caption); }
.sm-agent-options { display: flex; flex-direction: column; gap: 2px; }
.sm-agent-option { display: flex; align-items: center; gap: 8px; min-height: 46px; padding: 6px 4px; cursor: pointer; }
.sm-agent-option.is-readonly { cursor: default; }
.sm-agent-option input { width: 14px; height: 14px; margin: 0; accent-color: var(--text-2); flex-shrink: 0; }
.sm-agent-name { flex: 1; min-width: 0; font-size: var(--font-ui); }
.sm-agent-name small { display: block; font-size: var(--font-caption); color: var(--text-3); }
.sm-agent-state { color: var(--text-3); font-size: var(--font-caption); white-space: nowrap; }
.sm-save-link { width: 100%; margin-top: 12px; }
.sm-fine { font-size: var(--font-caption); line-height: 1.75; color: var(--text-3); margin-top: 12px !important; }
.sm-source-path { display: flex; align-items: flex-start; gap: 8px; padding: 12px; border-radius: var(--radius-control); background: var(--bg-input); color: var(--text-2); }
.sm-source-path svg { margin-top: 2px; }
.sm-source-path code { overflow-wrap: anywhere; font-size: var(--font-caption); line-height: 1.8; }
.sm-file-list { display: flex; flex-direction: column; padding: 10px 4px; gap: 7px; color: var(--text-2); }
.sm-file-list > span { display: flex; align-items: center; gap: 8px; font-size: var(--font-caption); }
.sm-edit-button { margin-top: 4px; }
.sm-config { font-size: var(--font-caption); line-height: 1.8; white-space: pre-wrap; overflow-wrap: anywhere; padding: 12px; background: var(--bg-input); border-radius: var(--radius-control); color: var(--text-2); }
.sm-connection { font-size: var(--font-caption); color: var(--text-3); margin-top: 12px; }
.sm-connection.is-ok { color: var(--green); }
.sm-connection.is-warn { color: var(--yellow); }
.sm-conflict-callout { display: flex; gap: 10px; margin-top: 24px; padding: 12px; background: color-mix(in srgb, var(--yellow) 7%, transparent); border-radius: var(--radius-control); }
.sm-conflict-callout > svg { margin-top: 1px; color: var(--yellow); }
.sm-conflict-callout strong { font-size: var(--font-caption); font-weight: 500; }
.sm-conflict-callout p { font-size: var(--font-caption); color: var(--text-2); margin: 5px 0 10px; }
.sm-detail-empty { display: flex; align-items: center; flex-direction: column; justify-content: center; min-height: 440px; padding: 24px; color: var(--text-3); text-align: center; }
.sm-empty-orbit { display: grid; place-items: center; width: 64px; height: 64px; background: var(--bg-raised); border-radius: var(--radius-card); margin-bottom: 20px; }
.sm-detail-empty h3 { font-size: var(--font-body); font-weight: 500; color: var(--text-2); margin-bottom: 8px; }
.sm-detail-empty p { line-height: 1.8; }
.sm-empty { display: flex; align-items: center; flex-direction: column; justify-content: center; min-height: 340px; color: var(--text-3); text-align: center; }
.sm-empty h3 { color: var(--text-2); font-size: var(--font-body); font-weight: 500; margin: 16px 0 6px; }
.sm-status-bar { display: flex; align-items: center; gap: 8px; min-height: 42px; color: var(--text-3); font-size: var(--font-caption); margin-top: 20px; }
.sm-status-dot { width: 5px; height: 5px; background: var(--text-3); border-radius: var(--radius-pill); flex-shrink: 0; }
.sm-mobile-scrim { display: none; }
.sm-modal-shade { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px; background: color-mix(in srgb, var(--bg-canvas) 78%, transparent); }
.sm-modal { width: min(820px, 100%); max-height: calc(100vh - 48px); display: flex; flex-direction: column; background: var(--bg-overlay); border-radius: var(--radius-modal); padding: 24px; box-shadow: var(--shadow-pop); overflow: auto; }
.sm-modal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sm-modal-head h2 { font-size: var(--font-title); font-weight: 500; }
.sm-editor-meta { display: flex; align-items: center; gap: 8px; color: var(--text-2); padding-top: 20px; }
.sm-editor-meta .sm-badge { margin-left: auto; }
.sm-modal-description { color: var(--text-2); margin-top: 14px !important; margin-bottom: 16px !important; }
.sm-editor { width: 100%; min-height: 320px; background: var(--bg-input); border: 1px solid var(--hairline); border-radius: var(--radius-control); font-family: var(--font-mono) !important; font-size: var(--font-ui) !important; line-height: 1.8; padding: 16px; resize: vertical; tab-size: 2; }
.sm-modal-footer { display: flex; justify-content: flex-end; align-items: center; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
.sm-modal-footer > span { flex: 1; color: var(--text-3); font-size: var(--font-caption); }
.sm-compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.sm-compare-card { min-width: 0; padding: 16px; background: var(--bg-input); border: 1px solid var(--hairline); border-radius: var(--radius-control); cursor: pointer; }
.sm-compare-card.is-selected { border-color: var(--text-2); }
.sm-compare-card > span { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.sm-compare-card input { accent-color: var(--text-2); }
.sm-compare-card strong { font-weight: 500; }
.sm-compare-card code { display: block; overflow-wrap: anywhere; font-size: var(--font-caption); color: var(--text-3); }
.sm-compare-card pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: var(--font-caption); line-height: 1.8; color: var(--text-2); margin-bottom: 0; }
@media (min-width: 1600px) { .sm-workbench { padding-left: 12px; } }
@media (max-width: 1190px) { .sm-workbench { grid-template-columns: 172px minmax(0, 1fr); } .sm-sheet { padding: 28px 24px 0; } .sm-manager-grid { grid-template-columns: minmax(0, 1fr) 288px; gap: 20px; } .sm-detail { padding-left: 20px; } .sm-scope-hint { display: none; } }
@media (max-width: 979px) {
  .sm-workbench { grid-template-columns: 148px minmax(0, 1fr); }
  .sm-navigation { padding: 24px 8px; }
  .sm-nav-foot { padding-left: 8px; padding-right: 8px; }
  .sm-manager-grid { display: block; min-height: 480px; }
  .sm-detail-empty { display: none; }
  .sm-detail { position: fixed; inset: 72px 16px 16px auto; width: min(360px, calc(100vw - 32px)); z-index: 20; padding: 24px; border: 0; border-radius: var(--radius-card); background: var(--bg-overlay); overflow: auto; box-shadow: var(--shadow-pop); }
  .sm-mobile-scrim { display: block; position: fixed; inset: 0; z-index: 19; background: color-mix(in srgb, var(--bg-canvas) 60%, transparent); border: 0; }
}
@media (max-width: 620px) {
  .sm-window-bar { padding: 0 16px; height: 54px; }
  .sm-brand { gap: 8px; }
  .sm-window-label, .sm-window-divider { display: none; }
  .sm-window-actions { gap: 8px; }
  .sm-prototype-badge { font-size: var(--font-caption); }
  .sm-workbench { display: flex; flex-direction: column; padding: 0 8px 8px; min-height: calc(100vh - 54px); }
  .sm-navigation { padding: 0 4px 12px; }
  .sm-nav-caption, .sm-nav-foot { display: none; }
  .sm-navigation nav { flex-direction: row; gap: 4px; }
  .sm-nav-item { padding: 8px 10px; gap: 8px; min-height: 42px; }
  .sm-nav-item > svg { width: 16px; height: 16px; }
  .sm-sheet { padding: 24px 16px 0; min-height: calc(100vh - 116px); }
  .sm-page-top { align-items: flex-start; gap: 12px; }
  .sm-page-top h1 { font-size: var(--font-title); }
  .sm-page-top p { font-size: var(--font-caption); line-height: 1.75; }
  .sm-eyebrow { font-size: var(--font-caption); gap: 8px; }
  .sm-demo-wrap { padding-top: 24px; }
  .sm-demo-wrap > .sm-button { padding: 6px 10px; }
  .sm-scope-bar { gap: 12px; padding: 24px 0 20px; }
  .sm-scope-switch { width: 100%; }
  .sm-scope-switch > button { flex: 1; justify-content: center; min-height: 38px; }
  .sm-scope-bar > select { width: 100%; }
  .sm-list-tools { gap: 8px; }
  .sm-list-tools > select { width: 112px; padding-left: 8px; padding-right: 16px; }
  .sm-search { padding: 0 8px; gap: 6px; }
  .sm-asset-row { gap: 10px; padding: 14px 8px; }
  .sm-row-icon { width: 30px; height: 36px; }
  .sm-row-name { font-size: var(--font-ui); gap: 6px; }
  .sm-row-targets { gap: 0; }
  .sm-target-mark { width: 21px; height: 23px; }
  .sm-asset-row > svg { display: none; }
  .sm-row-description { max-width: 100%; }
  .sm-list-heading { padding: 0 8px; }
  .sm-list-bottom { margin-left: 4px; margin-right: 4px; }
  .sm-list-bottom > span:last-child { display: none; }
  .sm-status-bar { padding: 12px 0; align-items: flex-start; line-height: 1.7; }
  .sm-status-dot { margin-top: 7px; }
  .sm-modal-shade { padding: 12px; }
  .sm-modal { padding: 20px 16px; max-height: calc(100vh - 24px); }
  .sm-editor { min-height: 280px; }
  .sm-modal-footer > span { flex-basis: 100%; }
  .sm-compare-grid { grid-template-columns: 1fr; }
}
