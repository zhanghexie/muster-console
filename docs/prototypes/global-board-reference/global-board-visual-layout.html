<script>
(() => {
const root = document.getElementById('board-design-preview');
const app = root.querySelector('.bd-app');
const columns = root.querySelector('.bd-columns');
const feedback = root.querySelector('.bd-feedback');
const tasks = [
 {id:'a1',group:'active',type:'C',title:'工作面板 27',ws:'TestMetaAgent',time:'12h',summary:'展示 ui.render 部件'},
 {id:'a2',group:'active',type:'C',title:'工作面板 36',ws:'MetaApp',time:'1m'},
 {id:'a3',group:'active',type:'P',title:'工作面板 24',ws:'TestMetaAgent',time:'12h'},
 {id:'a4',group:'active',type:'C',title:'工作面板 17',ws:'metaagent',time:'4d',summary:'待命'},
 {id:'a5',group:'active',type:'P',title:'GLM 审查员·三线复审',ws:'metaagent',time:'8m',summary:'宿主五条修复复审 PASS（附…）',orch:true},
 {id:'a6',group:'active',type:'P',title:'工作面板 22',ws:'MetaApp',time:'1m',summary:'排查会话搜索关键词换行问题'},
 {id:'a7',group:'active',type:'C',title:'Prepare提前GetAsset',ws:'MetaApp',time:'1m',summary:'等 Android GetAsset 包 185…'},
 {id:'a8',group:'active',type:'C',title:'修消费添加截图',ws:'MetaApp',time:'4h'},
 {id:'a9',group:'active',type:'P',title:'README 更新与状态上报复盘',ws:'TestMetaAgent',time:'12h',summary:'会话已重命名，复盘补充完毕'},
 {id:'n1',group:'needs',type:'C',title:'倒挂对账未改等看',ws:'MetaApp',time:'4h',summary:'停着，等你开口',actions:['通过','打回','搁置']},
 {id:'n2',group:'needs',type:'C',title:'【在排查】7117345583变身隐身',ws:'MetaApp',time:'3h',summary:'未 push，等你看转化 rebase',actions:['通过','打回','搁置']},
 {id:'n3',group:'needs',type:'C',title:'编辑器卡顿匹配失败',ws:'MetaApp',time:'3h',summary:'编辑器卡顿嫌疑已收敛，等确认',actions:['通过','打回','搁置']},
 {id:'d1',group:'done',type:'C',title:'原型目录归档',ws:'metaagent',time:'8m',summary:'原型目录已归档，引用与测试…'},
 {id:'d2',group:'done',type:'P',title:'多模态UI审查员',ws:'metaagent',time:'18h',summary:'UI批二复审完成 PASS，报告…',orch:true},
 {id:'d3',group:'done',type:'C',title:'【在排查】7123290317',ws:'MetaApp',time:'3h',summary:'结论已发群，未提测',task:'任务 t-1（表中无此任务）',actions:['取消完成标记'],orch:true},
 {id:'d4',group:'done',type:'C',title:'【已提MR】12548',ws:'MetaApp',time:'4h',summary:'新 MR 12548 已催大山'},
 {id:'d5',group:'done',type:'C',title:'调研UGC AI生成链路',ws:'MetaApp',time:'4h',summary:'文档已写，等验收',actions:['取消完成标记']},
 {id:'d6',group:'done',type:'C',title:'对照7两条ISM',ws:'MetaApp',time:'1m',summary:'7两句差异已对齐',actions:['取消完成标记']},
 {id:'d7',group:'done',type:'C',title:'72合入temp并开MR',ws:'MetaApp',time:'4h',summary:'四仓 MR 已开并催合，等确认',actions:['取消完成标记']}
];
const groups = [{key:'active',name:'进行中',total:14,color:'var(--bd-blue)',status:'空闲',mark:'◷'},{key:'needs',name:'需要你',total:3,color:'var(--bd-yellow)',status:'待验收',mark:'⊙'},{key:'done',name:'已完成',total:12,color:'var(--bd-green)',status:'已完成',mark:'✓'}];
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state = {theme:'dark',filtered:false,archive:false,gap:0};
const saved = window.openai?.widgetState;
if(saved?.modelContent?.prototype==='global-board-design') {state.theme=saved.modelContent.theme==='dark'?'dark':'light';state.filtered=!!saved.privateContent?.filtered;}
function save(){window.openai?.setWidgetState?.({modelContent:{prototype:'global-board-design',theme:state.theme},privateContent:{filtered:state.filtered}})?.catch(()=>{});}
function render(){
 app.dataset.theme=state.theme;app.style.setProperty('--bd-gap',state.gap+'px');
 root.querySelectorAll('[data-theme]').forEach(b=>{if(b.tagName==='BUTTON')b.setAttribute('aria-pressed',String(b.dataset.theme===state.theme));});
 root.querySelector('.bd-filter').setAttribute('aria-pressed',String(state.filtered));
 root.querySelector('.bd-filter').textContent=state.filtered?'全部工作区':'仅当前工作区';
 root.querySelector('.bd-scope').textContent=state.filtered?'当前工作区 · MetaApp':'全部工作区';
 root.querySelector('.bd-archive').setAttribute('aria-pressed',String(state.archive));
 columns.innerHTML=groups.map(g=>{
 const rows=tasks.filter(t=>t.group===g.key&&(!state.filtered||t.ws==='MetaApp'));
 return `<section class="bd-column" style="--bd-state:${g.color}" aria-label="${g.name}"><header class="bd-column-head"><span class="bd-dot"></span><span>${g.name}</span><span class="bd-count">${state.filtered?rows.length:g.total}</span></header><div class="bd-well">${rows.map(t=>`<article class="bd-task" data-id="${t.id}"><div class="bd-task-head"><span class="bd-avatar" aria-label="${t.type==='C'?'Codex':'Pi'}">${t.type}</span><button type="button" class="bd-title" data-select="${t.id}">${esc(t.title)}</button><time class="bd-time">${t.time}</time></div><div class="bd-meta"><span class="bd-state"><span class="bd-state-mark">${g.mark}</span>${t.orch?'<span class="bd-orch" data-tooltip="由调度编排" aria-label="由调度编排"></span>':''}${g.status}</span><span class="bd-workspace">${esc(t.ws)}</span></div>${t.summary?`<p class="bd-summary">${esc(t.summary)}</p>`:''}${t.task?`<p class="bd-related">${esc(t.task)}</p>`:''}${t.actions?`<div class="bd-actions">${t.actions.map(a=>`<button type="button" data-action="${esc(a)}" data-task="${t.id}">${a}</button>`).join('')}</div>`:''}</article>`).join('')}</div></section>`;
 }).join('')+(state.archive?'<div class="bd-archive-area"><span>归档 · 40</span><span>此截图未提供归档任务内容</span></div>':'');
}
root.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.theme){state.theme=b.dataset.theme;render();save();return;}
 if(b.classList.contains('bd-filter')){state.filtered=!state.filtered;render();save();return;}
 if(b.classList.contains('bd-archive')){state.archive=!state.archive;render();return;}
 if(b.dataset.select){root.querySelectorAll('.bd-task').forEach(c=>c.classList.toggle('is-selected',c.dataset.id===b.dataset.select));feedback.textContent='已选中：'+tasks.find(t=>t.id===b.dataset.select).title;return;}
 if(b.dataset.action){feedback.textContent='操作预览：'+b.dataset.action+' · '+tasks.find(t=>t.id===b.dataset.task).title;return;}
 if(b.dataset.preview)feedback.textContent='操作预览：'+b.dataset.preview;
});
