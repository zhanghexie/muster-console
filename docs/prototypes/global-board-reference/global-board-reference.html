<style>

#reference-board .rb-app {border-radius:var(--rb-radius-modal);font-size:var(--rb-font-ui);}

#reference-board .rb-chrome {font-size:var(--rb-font-caption);}
#reference-board h1 {font-size:var(--rb-font-title);font-weight:500;}
#reference-board .rb-heading .rb-close {font-size:20px;}
#reference-board .rb-heading {margin-bottom:24px;}

#reference-board .rb-status {border-radius:var(--rb-radius-pill);corner-shape:round;padding:1px 7px;}

#reference-board .rb-actions button {padding:0;border-radius:0;}
#reference-board .rb-heading {display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:start;gap:12px;}
#reference-board .rb-heading h1 {line-height:32px;}
#reference-board .rb-heading .rb-close {justify-self:end;width:32px;height:32px;padding:0;}
#reference-board .rb-card-head {display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:start;gap:8px;margin-bottom:8px;}
#reference-board .rb-card-head .rb-provider {margin-top:1px;}
#reference-board .rb-card-head .rb-time {padding-top:3px;font-size:var(--rb-font-caption);color:var(--rb-muted);white-space:nowrap;}
#reference-board .rb-task {padding-bottom:12px;}
#reference-board .rb-tags {margin-bottom:0;}
#reference-board .rb-actions {padding:8px 0 0;}
#reference-board .rb-scrollframe {position:relative;min-height:0;}
#reference-board .rb-list {scrollbar-width:none;}
#reference-board .rb-list::-webkit-scrollbar {display:none;}
#reference-board .rb-app .rb-scroll-thumb {position:absolute;right:1px;top:0;width:5px;min-height:0;padding:0;border:0;border-radius:var(--rb-radius-pill);corner-shape:round;background:var(--rb-control);opacity:0;touch-action:none;}
#reference-board .rb-scrollframe:hover .rb-scroll-thumb,#reference-board .rb-scrollframe:focus-within .rb-scroll-thumb {opacity:1;}
#reference-board .rb-app .rb-scroll-thumb:focus-visible {outline:1px solid var(--rb-focus);outline-offset:0;}
@media(max-width:850px) {#reference-board .rb-board {padding:23px 18px 0;}#reference-board .rb-columns {gap:10px;}#reference-board .rb-task {padding:11px 10px 0;}#reference-board .rb-column-head {padding:14px 12px;}}
@media(max-width:620px) {#reference-board .rb-columns {grid-template-columns:1fr;gap:18px;}#reference-board .rb-list {height:auto;}#reference-board .rb-preview {padding-right:0;}#reference-board .rb-management {gap:4px;}#reference-board .rb-heading {margin-bottom:22px;}#reference-board .rb-board {padding:20px 14px 0;}}

<script>
(() => {
 const root=document.getElementById('reference-board');
 const app=root.querySelector('.rb-app');
 const columns=root.querySelector('.rb-columns');
 const feedback=root.querySelector('.rb-feedback');
 const tasks = [
 {id:'a1',group:'active',type:'C',title:'工作面板 27',ws:'TestMetaAgent',time:'12h',summary:'展示 ui.render 部件'},

 {id:'a4',group:'active',type:'C',title:'工作面板 17',ws:'metaagent',time:'4d',summary:'待命'},
 {id:'a5',group:'active',type:'P',title:'GLM 审查员·三线复审',ws:'metaagent',time:'8m',summary:'宿主五条修复复审 PASS（附…）',orch:true},
 {id:'a6',group:'active',type:'P',title:'工作面板 22',ws:'MetaApp',time:'1m',summary:'排查会话搜索关键词换行问题'},
 {id:'a7',group:'active',type:'C',title:'Prepare提前GetAsset',ws:'MetaApp',time:'1m',summary:'等 Android GetAsset 包 185…'},
 {id:'a8',group:'active',type:'C',title:'修消费添加截图',ws:'MetaApp',time:'4h'},
 {id:'a9',group:'active',type:'P',title:'README 更新与状态上报复盘',ws:'TestMetaAgent',time:'12h',summary:'会话已重命名，复盘补充完毕'},
 {id:'n1',group:'needs',type:'C',title:'倒挂对账未改等看',ws:'MetaApp',time:'4h',summary:'停着，等你开口',actions:['通过','打回','搁置']},
 {id:'n2',group:'needs',type:'C',title:'【在排查】7117345583变身隐身',ws:'MetaApp',time:'3h',summary:'未 push，等你看转化 rebase',actions:['通过','打回','搁置']},
 {id:'n3',group:'needs',type:'C',title:'编辑器卡顿匹配失败',ws:'MetaApp',time:'3h',summary:'编辑器卡顿嫌疑已收敛，等确认',actions:['通过','打回','搁置']},
 {id:'d1',group:'done',type:'C',title:'原型目录归档',ws:'metaagent',time:'8m',summary:'原型目录已归档，引用与测试…'},
 {id:'d2',group:'done',type:'P',title:'多模态UI审查员',ws:'metaagent',time:'18h',summary:'UI批二复审完成 PASS，报告…',orch:true},
 {id:'d3',group:'done',type:'C',title:'【在排查】7123290317',ws:'MetaApp',time:'3h',summary:'结论已发群，未提测',task:'任务 t-1（表中无此任务）',actions:['取消完成标记'],orch:true},
 {id:'d4',group:'done',type:'C',title:'【已提MR】12548',ws:'MetaApp',time:'4h',summary:'新 MR 12548 已催大山'},
 {id:'d5',group:'done',type:'C',title:'调研UGC AI生成链路',ws:'MetaApp',time:'4h',summary:'文档已写，等验收',actions:['取消完成标记']},
 {id:'d6',group:'done',type:'C',title:'对照7两条ISM',ws:'MetaApp',time:'1m',summary:'7两句差异已对齐',actions:['取消完成标记']},
 {id:'d7',group:'done',type:'C',title:'72合入temp并开MR',ws:'MetaApp',time:'4h',summary:'四仓 MR 已开并催合，等确认',actions:['取消完成标记']}
];
 const groups=[{key:'active',name:'进行中',total:14,status:'空闲',bg:'var(--rb-blue-bg)',fg:'var(--rb-blue-fg)',tagBg:'var(--rb-neutral-bg)',tagFg:'var(--rb-neutral-fg)'},{key:'needs',name:'需要你',total:3,status:'待验收',bg:'var(--rb-amber-bg)',fg:'var(--rb-amber-fg)',tagBg:'var(--rb-amber-bg)',tagFg:'var(--rb-amber-fg)'},{key:'done',name:'已完成',total:12,status:'已完成',bg:'var(--rb-green-bg)',fg:'var(--rb-green-fg)',tagBg:'var(--rb-green-bg)',tagFg:'var(--rb-green-fg)'}];
 const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const state={theme:'light',filtered:false,archive:false};
 const restore=s=>{const m=s?.modelContent||s;if(m?.prototype==='global-board-reference'){state.theme=m.theme==='dark'?'dark':'light';state.filtered=!!s.privateContent?.filtered;}};
 restore(window.openai?.widgetState);
 function save(){window.openai?.setWidgetState?.({modelContent:{prototype:'global-board-reference',theme:state.theme},privateContent:{filtered:state.filtered}})?.catch(()=>{});}
 function syncScrollbars(){
  root.querySelectorAll('.rb-scrollframe').forEach(frame=>{
   const list=frame.querySelector('.rb-list'),thumb=frame.querySelector('.rb-scroll-thumb');
   const overflow=list.scrollHeight-list.clientHeight;
   thumb.hidden=overflow<=0;
   if(overflow<=0)return;
   const size=Math.max(28,list.clientHeight*list.clientHeight/list.scrollHeight);
   thumb.style.height=size+'px';thumb.style.top=(list.scrollTop/overflow*(list.clientHeight-size))+'px';
   thumb.setAttribute('aria-valuenow',String(Math.round(list.scrollTop/overflow*100)));
  });
 }
 function render(){
  app.dataset.theme=state.theme;
  root.querySelectorAll('.rb-preview [data-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===state.theme)));

  root.querySelector('.rb-archive').setAttribute('aria-pressed',String(state.archive));
  columns.innerHTML=groups.map(g=>{
   const rows=tasks.filter(t=>t.group===g.key&&(!state.filtered||t.ws==='MetaApp'));
   return `<section class="rb-column" style="--rb-state-bg:${g.bg};--rb-state-fg:${g.fg};--rb-tag-bg:${g.tagBg};--rb-tag-fg:${g.tagFg}" aria-label="${g.name}">

    <div class="rb-scrollframe"><div class="rb-list" id="rb-list-${g.key}">${rows.map(t=>`<article class="rb-task" data-id="${t.id}">

     <div class="rb-tags"><span class="rb-status">${g.status}${t.orch?'<span class="rb-orch" data-tooltip="由调度编排" aria-label="由调度编排"></span>':''}</span><span class="rb-workspace">#${esc(t.ws)}</span></div>
     ${t.summary?`<p class="rb-summary">${esc(t.summary)}</p>`:''}
     ${t.task?`<p class="rb-related">${esc(t.task)}</p>`:''}
     ${t.actions?`<div class="rb-actions">${t.actions.map(a=>`<button type="button" data-action="${esc(a)}" data-task="${t.id}">${a}</button>`).join('')}</div>`:''}
    </article>`).join('')}</div><button type="button" class="rb-scroll-thumb" role="scrollbar" aria-label="滚动${g.name}列表" aria-controls="rb-list-${g.key}" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></button></div>
   </section>`;
  }).join('')+(state.archive?'<div class="rb-archive-note">归档 · 40（截图未提供归档任务内容）</div>':'');
  if(globalThis.lucide)lucide.createIcons({attrs:{width:13,height:13}});
  root.querySelectorAll('.rb-list').forEach(list=>list.addEventListener('scroll',syncScrollbars,{passive:true}));
  root.querySelectorAll('.rb-scroll-thumb').forEach(thumb=>{
   const list=thumb.parentElement.querySelector('.rb-list');
   thumb.addEventListener('pointerdown',e=>{const startY=e.clientY,startScroll=list.scrollTop;thumb.setPointerCapture(e.pointerId);const move=p=>{list.scrollTop=startScroll+(p.clientY-startY)*(list.scrollHeight-list.clientHeight)/(list.clientHeight-thumb.offsetHeight);};const stop=()=>{thumb.removeEventListener('pointermove',move);};thumb.addEventListener('pointermove',move);thumb.addEventListener('lostpointercapture',stop,{once:true});});
   thumb.addEventListener('keydown',e=>{const moves={ArrowDown:40,ArrowUp:-40,PageDown:list.clientHeight,PageUp:-list.clientHeight};if(e.key in moves){e.preventDefault();list.scrollTop+=moves[e.key];}else if(e.key==='Home'||e.key==='End'){e.preventDefault();list.scrollTop=e.key==='Home'?0:list.scrollHeight;}});
  });
  syncScrollbars();
 }
 root.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.theme){state.theme=b.dataset.theme;render();save();return;}
  if(b.classList.contains('rb-filter')){state.filtered=!state.filtered;render();save();return;}
  if(b.classList.contains('rb-archive')){state.archive=!state.archive;render();return;}
  if(b.dataset.select){root.querySelectorAll('.rb-task').forEach(t=>t.classList.toggle('is-selected',t.dataset.id===b.dataset.select));feedback.textContent='已选中：'+tasks.find(t=>t.id===b.dataset.select).title;return;}
  if(b.dataset.action){feedback.textContent='操作预览：'+b.dataset.action+' · '+tasks.find(t=>t.id===b.dataset.task).title;return;}
  if(b.dataset.preview)feedback.textContent='操作预览：'+b.dataset.preview;
 });
 window.addEventListener('openai:set_globals',e=>{restore(e.detail?.globals?.widgetState);render();});
 render();
 const sizeObserver=new ResizeObserver(syncScrollbars);sizeObserver.observe(root);
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{render();save();}});tweak.addSelect(state,'theme',{label:'主题',options:[{label:'浅色',value:'light'},{label:'深色',value:'dark'}]});}
})();
</script>
