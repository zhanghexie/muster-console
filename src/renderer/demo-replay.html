<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; frame-src 'self' about:; connect-src 'none'; object-src 'none'; form-action 'none'">

    html, body, main { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
